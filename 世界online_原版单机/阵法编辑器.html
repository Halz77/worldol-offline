<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阵法编辑器 · 世界OL 单机版</title>
<style>
  :root{
    --bg:#10162a; --panel:#1b2340; --panel2:#151c33; --line:#36477a; --line2:#4a6db8;
    --text:#dfe7f7; --dim:#8fa3c8; --gold:#ffe9a8; --gold2:#c8a34d;
    --ok:#7fd18a; --err:#ff8f8f; --btn:#2e4270; --btn2:#3b5aa6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;background:linear-gradient(#1d2748,#161e36);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;color:var(--gold);font-weight:700}
  header .ver{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
  header .grow{flex:1}
  button{background:var(--btn);color:var(--text);border:1px solid var(--line2);border-radius:6px;
    padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{background:var(--btn2)}
  button.primary{background:#2f5ea8;border-color:#6f9fe8}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{display:grid;grid-template-columns:210px 1fr;gap:0;height:calc(100vh - 58px)}
  aside{border-right:1px solid var(--line);background:var(--panel2);overflow:auto;padding:8px}
  aside .item{display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:7px 9px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:13px}
  aside .item:hover{background:#222c4d}
  aside .item.active{background:#35467a;border-color:var(--gold2)}
  aside .item.active .nm{color:var(--gold)}
  aside .dot{width:7px;height:7px;border-radius:50%;background:#56688f;flex:none}
  aside .item.done .dot{background:var(--gold)}
  section{padding:14px 18px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .card h2{margin:0 0 8px;font-size:15px;color:var(--gold)}
  .card h2 .sub{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
  .base{font-size:12px;color:var(--dim);margin:4px 0 10px;padding:6px 8px;background:#0e1526;border-radius:6px;border:1px solid #223052}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row select{min-width:260px}
  input,select{background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:13px}
  input[type=number]{width:88px}
  .row .del{color:var(--err);border-color:#5a2f3f;padding:3px 8px}
  .add{font-size:12px;padding:4px 10px}
  .modebar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--dim);margin-bottom:10px}
  .modebar label{cursor:pointer}
  .empty{color:var(--dim);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:10px}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  #status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:80vw;
    padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:20;background:#222c4d;border:1px solid var(--line2)}
  #status.ok{border-color:#3f7d4d;background:#1b3326;color:var(--ok)}
  #status.err{border-color:#7d3f3f;background:#331b1b;color:var(--err)}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2f5ea8;color:#fff;
    padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  #toast.show{opacity:1}
  .slothead{display:flex;align-items:center;justify-content:space-between}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>阵法编辑器</h1><span class="ver">第 94 版 · 阵位差异化加成</span>
  <span class="grow"></span>
  <button id="btn-load">载入 data 目录</button>
  <button id="btn-save" class="primary" disabled>保存到 data/</button>
  <button id="btn-download" disabled>下载配置</button>
</header>
<main>
  <aside id="form-list"></aside>
  <section id="editor"><div class="empty">点右上角「载入 data 目录」选择游戏目录里的 <code>data</code> 文件夹开始。<br>没有配置文件也行（全新配置从空开始）。</div></section>
</main>
<div id="status"></div>
<div id="toast"></div>

 *

const POWERS = (LABELS.powers || []).slice().sort((a, b) => a.id - b.id);
const FORMS = (LABELS.forms || []).slice().sort((a, b) => a.id - b.id);
const POWER_MAP = new Map(POWERS.map(p => [p.id, p]));
/* 常用项置顶（阵法通常调这些：攻击/防御/速度/命中/致命/生命法力） */
const COMMON_POWERS = [28, 29, 30, 31, 32, 33, 23, 24, 25, 26, 27, 12, 14];
const REVISION = 'formation-slots-20261025-v1';

const state = {
  conf: { revision: REVISION, mode: 'add', forms: {} },   // {mode, forms:{id:{mode,slots:[[{power,value}]],pet:[...]}}}
  selected: null,
  dirHandle: null,
  loaded: false
};

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
let toastTimer = null;
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function status(msg, kind = '') { const s = $('#status'); if (!msg) { s.style.display = 'none'; return; } s.className = kind; s.innerHTML = msg; s.style.display = 'block'; }

/* ── 配置读写 ─────────────────────────────────────────── */
function normalizeIncoming(raw) {
  const out = { revision: (raw && raw.revision) || REVISION, mode: raw && raw.mode === 'replace' ? 'replace' : 'add', forms: {} };
  const src = raw && raw.forms && typeof raw.forms === 'object' ? raw.forms : {};
  for (const [key, value] of Object.entries(src)) {
    const id = Number(key);
    if (!Number.isInteger(id) || id <= 0) continue;
    const form = { mode: value && value.mode === 'replace' ? 'replace' : (raw && raw.mode === 'replace' ? 'replace' : 'add'), slots: [[], [], [], [], []], pet: [] };
    const slots = value && Array.isArray(value.slots) ? value.slots : [];
    for (let i = 0; i < 5; i++) {
      const powers = slots[i] && Array.isArray(slots[i].powers) ? slots[i].powers : [];
      form.slots[i] = powers.map(row => ({ power: Number(row[0]) || 0, value: Number(row[1]) || 0 })).filter(x => x.power > 0 && x.value !== 0);
    }
    const pet = value && value.pet && Array.isArray(value.pet.powers) ? value.pet.powers : [];
    form.pet = pet.map(row => ({ power: Number(row[0]) || 0, value: Number(row[1]) || 0 })).filter(x => x.power > 0 && x.value !== 0);
    out.forms[id] = form;
  }
  return out;
}

function buildConfigText() {
  const forms = {};
  for (const [id, form] of Object.entries(state.conf.forms)) {
    const slots = form.slots.map(list => ({ powers: list.filter(x => x.power > 0 && x.value !== 0).map(x => [x.power, x.value]) }));
    const pet = { powers: form.pet.filter(x => x.power > 0 && x.value !== 0).map(x => [x.power, x.value]) };
    const anySlot = slots.some(s => s.powers.length) || pet.powers.length;
    if (!anySlot) continue;                                  // 全空 = 不写（避免塞垃圾）
    forms[String(id)] = { mode: form.mode, slots, pet };
  }
  return JSON.stringify({
    _readme: [
      "阵法阵位差异化加成（第 94 版）。原版每个阵只有 3 组统一加成（全队一样），",
      "本文件让同一个阵可以「第 1 个人加伤害、第 2 个人加减伤、宠物另算」。",
      "forms[阵型id] = { mode:'add'|'replace', slots:[5 个阵位], pet:{powers} }；",
      "add=在统一加成之上叠加，replace=顶掉统一加成只吃阵位加成。",
      "阵位按战斗中己方角色（不含宠物）站位从前到后排名；非战斗面板按第 1 位。",
      "由 阵法编辑器.html 生成；读取方 lib/local-formation-slots.mjs。"
    ],
    revision: state.conf.revision || REVISION,
    mode: state.conf.mode === 'replace' ? 'replace' : 'add',
    forms
  }, null, 1) + "\n";
}

async function loadFromDir() {
  if (typeof window.showDirectoryPicker !== 'function') {
    status("这个浏览器不支持直接读目录（需要 Chrome/Edge）。可改用「下载配置」后再手动放进 <b>data/</b>。", "err");
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'worldol-data' });
    state.dirHandle = dir;
    let raw = null;
    try {
      const fh = await dir.getFileHandle('local-formation-slots.json');
      raw = JSON.parse(await (await fh.getFile()).text());
    } catch (err) {
      if (err && err.name !== 'NotFoundError' && err.name !== 'TypeError') throw err;
    }
    state.conf = normalizeIncoming(raw);
    state.loaded = true;
    state.selected = state.selected || (FORMS[0] && FORMS[0].id) || null;
    $("#btn-save").disabled = false;
    $("#btn-download").disabled = false;
    renderList(); renderEditor();
    const n = Object.keys(state.conf.forms).length;
    status(raw ? ("已载入配置（" + n + " 个阵有自定义阵位加成）。改完点<b>保存到 data/</b>，重启游戏生效。") : "目录里还没有配置文件，已从空白开始。", "ok");
  } catch (err) {
    if (err && err.name === 'AbortError') { state.dirHandle = null; return; }
    status("读取失败：" + (err && err.message || err), "err");
  }
}

async function save() {
  const text = buildConfigText();
  if (state.dirHandle) {
    try {
      const fh = await state.dirHandle.getFileHandle('local-formation-slots.json', { create: true });
      const w = await fh.createWritable();
      await w.write(text); await w.close();
      const n = Object.keys(JSON.parse(text).forms).length;
      status("已写入 <b>local-formation-slots.json</b>（" + n + " 个阵）。重启游戏（电脑版）或重新打包（APK）生效。", "ok");
      toast("写入成功");
      return;
    } catch (err) {
      status("直接写入失败（" + (err && err.message || err) + "），已改为下载文件，请手动放进 data/。", "err");
    }
  }
  download('local-formation-slots.json', text);
  toast("已下载，请放进 data/ 目录");
}

function download(name, text) {
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 列表 ─────────────────────────────────────────────── */
function renderList() {
  const list = $('#form-list');
  list.innerHTML = '';
  for (const form of FORMS) {
    const conf = state.conf.forms[form.id];
    const done = conf && (conf.slots.some(s => s.length) || conf.pet.length);
    const item = el('div', 'item' + (state.selected === form.id ? ' active' : '') + (done ? ' done' : ''));
    item.appendChild(el('span', 'nm', form.name));
    item.appendChild(el('span', 'dot'));
    item.onclick = () => { state.selected = form.id; renderList(); renderEditor(); };
    list.appendChild(item);
  }
}

/* ── 编辑区 ───────────────────────────────────────────── */
function formConf(id) {
  if (!state.conf.forms[id]) state.conf.forms[id] = { mode: state.conf.mode, slots: [[], [], [], [], []], pet: [] };
  return state.conf.forms[id];
}
function powerName(id) { const p = POWER_MAP.get(id); return p ? p.name : ('未知(' + id + ')'); }
function baseText(form) {
  const parts = [];
  for (let i = 1; i <= 3; i++) {
    const p = form['power' + i], v = form['value' + i];
    if (p && v) parts.push(powerName(p) + ' ' + (v > 0 ? '+' : '') + v);
  }
  return parts.length ? ('原版统一加成：' + parts.join('，')) : '原版无统一加成';
}

function powerSelect(current, onPick) {
  const sel = document.createElement('select');
  const addGroup = (label, list) => {
    if (!list.length) return;
    const g = document.createElement('optgroup');
    g.label = label;
    for (const p of list) {
      const o = document.createElement('option');
      o.value = String(p.id);
      o.textContent = p.name + '（' + p.id + '）';
      g.appendChild(o);
    }
    sel.appendChild(g);
  };
  const common = COMMON_POWERS.map(id => POWER_MAP.get(id)).filter(Boolean);
  const commonIds = new Set(common.map(p => p.id));
  addGroup('常用', common);
  addGroup('全部', POWERS.filter(p => p.id !== 0 && !commonIds.has(p.id)));
  if (!POWER_MAP.has(current) && current) {
    const o = document.createElement('option');
    o.value = String(current); o.textContent = '未知（' + current + '）';
    sel.appendChild(o);
  }
  sel.value = String(current || 28);
  sel.onchange = () => onPick(Number(sel.value));
  return sel;
}

function rowEditor(list, index, onChange, onRemove) {
  const item = list[index];
  const row = el('div', 'row');
  row.appendChild(powerSelect(item.power, v => { item.power = v; onChange(); }));
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = '-200'; inp.max = '200'; inp.step = '1';
  inp.value = item.value;
  inp.onchange = () => {
    const v = Number(inp.value);
    item.value = Number.isFinite(v) ? Math.round(v) : 0;
    inp.value = item.value;
    onChange();
  };
  row.appendChild(inp);
  row.appendChild(el('span', 'hint', '百分点（负数=削减）'));
  const del = el('button', 'del', '删除');
  del.onclick = () => { onRemove(index); };
  row.appendChild(del);
  return row;
}

function buildPowerCard(title, sub, list, baseLine) {
  const card = el('div', 'card');
  const head = el('div', 'slothead');
  const h = el('h2', null, title);
  if (sub) h.appendChild(el('span', 'sub', sub));
  head.appendChild(h);
  const add = el('button', 'add', '+ 加一条加成');
  add.onclick = () => { list.push({ power: 28, value: 5 }); rerender(); };
  head.appendChild(add);
  card.appendChild(head);
  if (baseLine) card.appendChild(el('div', 'base', baseLine));
  if (!list.length) card.appendChild(el('div', 'hint', '还没有配置（这个位置保持原版数值）'));
  list.forEach((item, i) => {
    card.appendChild(rowEditor(list, i, () => rerender(false), () => { list.splice(i, 1); rerender(); }));
  });
  return card;
}

function rerender(rebuild = true) {
  if (rebuild) renderEditor();
  else { /* 单行改动不重建，避免输入框失焦 */ }
}

function renderEditor() {
  const pane = $('#editor');
  pane.innerHTML = '';
  if (!state.selected) { pane.appendChild(el('div', 'empty', '从左边选一个阵开始配置')); return; }
  const form = FORMS.find(f => f.id === state.selected);
  if (!form) { pane.appendChild(el('div', 'empty', '未知阵型')); return; }
  const conf = formConf(form.id);

  const head = el('div', 'card');
  const h = el('h2', null, form.name);
  h.appendChild(el('span', 'sub', 'teamcount ' + (form.teamcount || '-') + ' · 阵型 id ' + form.id));
  head.appendChild(h);
  head.appendChild(el('div', 'base', baseText(form)));

  const modeBar = el('div', 'modebar');
  const mkMode = (value, label, tip) => {
    const lab = el('label');
    const r = document.createElement('input');
    r.type = 'radio'; r.name = 'form-mode'; r.value = value;
    r.checked = (conf.mode === value);
    r.onchange = () => { conf.mode = value; renderList(); };
    lab.appendChild(r);
    lab.appendChild(document.createTextNode(' ' + label));
    lab.title = tip;
    return lab;
  };
  modeBar.appendChild(mkMode('add', '叠加模式', '原版统一加成 + 下面的阵位加成'));
  modeBar.appendChild(mkMode('replace', '替换模式', '顶掉原版统一加成，只吃下面的阵位加成'));
  modeBar.appendChild(el('span', 'hint', '当前：' + (conf.mode === 'replace' ? '替换' : '叠加')));
  head.appendChild(modeBar);
  head.appendChild(el('div', 'hint', '阵位按战斗中己方「角色」（不含宠物）站位从前到后排名：第 1 位=最靠前的那个。非战斗面板按第 1 位算。'));
  pane.appendChild(head);

  for (let i = 0; i < 5; i++) {
    const card = buildPowerCard('第 ' + (i + 1) + ' 位', i === 0 ? '（最靠前的角色）' : '', conf.slots[i]);
    pane.appendChild(card);
  }
  pane.appendChild(buildPowerCard('宠物（所有宠物统一）', '不占角色阵位', conf.pet));

  const tip = el('div', 'card');
  tip.appendChild(el('h2', null, '说明'));
  tip.appendChild(el('div', 'hint',
    '· 「叠加模式」下，这一位的角色 = 原版统一加成 + 这里配的加成；没配的位置保持原版数值。\n' +
    '· 「替换模式」下，原版 3 组统一加成对全队失效，每个位置只吃这里配的（没配=没有加成）。\n' +
    '· 加成的 power 与技能/装备同一套（28=劈砍攻击%、31=劈砍防御%、23=出手速度% 等）。\n' +
    '· 改完点「保存到 data/」，电脑版重启生效；APK 需要重新打包。'));
  pane.appendChild(tip);
}

/* ── 事件 ─────────────────────────────────────────────── */
$('#btn-load').onclick = loadFromDir;
$('#btn-save').onclick = save;
$('#btn-download').onclick = () => { download('local-formation-slots.json', buildConfigText()); toast('已下载，请放进 data/ 目录'); };

/* 初始化：没有载入目录时也允许先看界面（用空白配置） */
state.selected = FORMS[0] && FORMS[0].id;
renderList();
renderEditor();
status("先点右上角「载入 data 目录」选游戏的 <code>data</code> 文件夹；没有配置文件时从空白开始。", "");
</script>
</body>
</html>
