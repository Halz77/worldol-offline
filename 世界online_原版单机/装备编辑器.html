<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界OL 单机版 · 装备编辑器</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#d9dce3; --line-soft:#e8eaef;
  --text:#1f2329; --dim:#6b7280; --accent:#2f6fed; --accent-soft:#e8f0ff;
  --warn:#c2410c; --danger:#d94a3d; --ok:#177245; --edited:#7c3aed;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:13px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{
  font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--text);cursor:pointer;white-space:nowrap;
}
button:hover:not(:disabled){border-color:#b9c0cc;background:#fafbfc}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:#2560d8;border-color:#2560d8}
button.ghost{border-color:transparent;background:transparent;color:var(--dim)}
button.ghost:hover:not(:disabled){background:#eceef2;border-color:transparent}
button.mini{padding:2px 8px;font-size:12px}
input,select{
  font:inherit;padding:4px 7px;border:1px solid var(--line);border-radius:5px;
  background:#fff;color:var(--text);height:28px;
}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[type=number]{width:92px;text-align:right;font-family:var(--mono)}
input[type=checkbox]{accent-color:var(--accent);height:auto;padding:0;border:none;border-radius:0;background:none}
input.changed,select.changed{border-color:var(--edited);background:#f7f2ff}

header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);
}
header h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.2px}
header h1 span{color:var(--dim);font-weight:400;margin-left:6px;font-size:12px}
header .grow{flex:1}
#status{display:none;padding:7px 14px;font-size:12px;border-bottom:1px solid var(--line);background:#fffbe9;color:#7a5b00}
#status.err{background:#fdeceb;color:#a3241a}
#status.ok{background:#eaf7ef;color:#12603c}
#status b{font-weight:600}

main{flex:1;display:flex;min-height:0}

/* ---------- 左：装备列表 ---------- */
#list-pane{
  width:310px;min-width:310px;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);
}
.filters{padding:9px 10px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:7px}
.filters .row{display:flex;gap:6px;align-items:center}
.filters input[type=search]{flex:1;min-width:0;height:30px}
.filters select{flex:1;min-width:0}
.filters label.chk{display:flex;gap:5px;align-items:center;color:var(--dim);font-size:12px;cursor:pointer;user-select:none}
#list-info{padding:6px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line-soft)}
#list{flex:1;overflow:auto;padding:4px 0 24px}
.item{
  display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;border-left:3px solid transparent;
}
.item:hover{background:#f3f6fb}
.item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--dim);font-size:11px;font-family:var(--mono);white-space:nowrap}
.item .dot{width:6px;height:6px;border-radius:50%;background:var(--edited);opacity:0;flex:none}
.item.edited .dot{opacity:1}
.item.edited .nm{color:var(--edited);font-weight:600}
.tag{
  display:inline-block;padding:0 5px;border-radius:4px;font-size:11px;line-height:16px;
  background:#eef1f6;color:#5b6472;flex:none;
}

/* ---------- 右：详情 ---------- */
#detail-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#detail-head{
  padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
}
#detail-head .t{font-size:15px;font-weight:700;line-height:1.3}
#detail-head .sub{color:var(--dim);font-size:12px;margin-top:2px}
#detail-head .grow{flex:1}
#detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#detail-body{flex:1;overflow:auto;padding:14px 16px 40px}
#detail-body.hide{display:none}
.summary{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin-bottom:14px;font-size:12.5px;line-height:1.9;
}
.summary b{font-weight:600}
.summary .k{color:var(--dim);display:inline-block;margin-right:4px}
.summary .v{font-family:var(--mono)}
.summary .sep{color:#d2d6de;margin:0 8px}

section.group{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
section.group>h2{
  margin:0;padding:8px 12px;font-size:12.5px;font-weight:600;color:#4a5262;
  border-bottom:1px solid var(--line-soft);background:#fbfcfd;border-radius:8px 8px 0 0;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px 16px;padding:11px 12px}
.field{display:flex;align-items:center;gap:8px;min-width:0}
.field>label{flex:0 0 148px;min-width:0;color:#4a5262;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field>label .base{color:#a5acb8;font-family:var(--mono);font-size:11px;margin-left:4px}
.field .ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.field .ctl select{min-width:0;max-width:100%}
.field input[type=text]{flex:1;min-width:0}
.field input[type=number]{flex:0 0 auto}
.field .hint{color:#9aa1ad;font-size:11px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 属性下拉的选项文字很长（「121 · 鉴定格（随机词条）」），单行塞不下 → 标签一行、下拉一行，
   提示再一行；不然会压到右边/下一个格子的标签上。 */
.field.stack{flex-direction:column;align-items:stretch;gap:3px}
.field.stack>label{flex:none;white-space:normal;overflow:visible;text-overflow:clip}
.field.stack .ctl{width:100%;flex-wrap:wrap}
.field.stack .ctl select{flex:1 1 100%;width:100%}
.field.stack .hint{flex:1 1 100%;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
/* 「数值」这类带说明的窄控件：标签 / 控件 / 说明 各占一行，不再挤在一条线上 */
.field.stack .ctl input[type=number]{flex:0 0 auto}
.field.wide{grid-column:1/-1}
.field.wide textarea{
  flex:1;min-width:0;min-height:56px;font:inherit;padding:5px 7px;
  border:1px solid var(--line);border-radius:5px;resize:vertical;
}
.field.wide textarea.changed{border-color:var(--edited);background:#f7f2ff}

/* ---------- 鉴定范围（第 87 版） ---------- */
#identify-section>.id-note{color:#7a8494;font-size:12px;padding:9px 12px 0;line-height:1.7}
#identify-section .id-body{padding:9px 12px 12px;display:flex;flex-direction:column;gap:10px}
.id-slot{border:1px solid var(--line-soft);border-radius:7px;background:#fcfdfe}
.id-slot.dirty{border-color:var(--edited);background:#fbf8ff}
.id-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.id-head b{font-size:12.5px;flex:none}
.id-head code{font-family:var(--mono);font-size:11px;color:#8b93a1;flex:none}
.id-head .grow{flex:1;min-width:0}
.id-hint{padding:6px 10px 0;color:#8b93a1;font-size:11.5px;line-height:1.5}
.id-opts{padding:7px 10px;display:flex;flex-direction:column;gap:6px}
.id-opt{display:grid;grid-template-columns:minmax(0,1fr) 84px auto 84px auto;align-items:center;gap:6px}
.id-opt select{width:100%;min-width:0}
.id-opt input[type=number]{width:100%}
.id-opt .tilde{color:#9aa1ad;text-align:center}
.id-empty-slot{padding:8px 10px;color:#9aa1ad;font-size:12px}
.id-slot>.id-note{padding:8px 10px 0;color:#9aa1ad;font-size:11.5px}

#preview-wrap{padding:0 16px 20px}
#preview-wrap.hide{display:none}
details.preview{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.preview>summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:#4a5262;user-select:none}
#preview{
  margin:0;padding:10px 12px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre;overflow:auto;max-height:320px;
  color:#374151;
}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:#1f2329;color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50;max-width:80vw;
}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#cdd2db;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b6bcc8;background-clip:content-box}
</style>
</head>
<body>

<header>
  <h1>装备编辑器 <span>世界OL 单机版 · 改的是装备定义（所有副本一起变）</span></h1>
  <div class="grow"></div>
  <button id="btn-load" class="ghost" title="载入已有的 local-item-overrides.json 继续改">载入覆盖文件…</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <button id="btn-reset-all" class="ghost" disabled>还原全部改动</button>
  <button id="btn-download" disabled>下载覆盖文件</button>
  <button id="btn-save" class="primary" disabled>保存到 data 目录…</button>
</header>

<div id="status"></div>

<main>
  <div id="list-pane">
    <div class="filters">
      <div class="row">
        <input id="search" type="search" placeholder="搜名称 / 道具编号…">
      </div>
      <div class="row">
        <select id="f-type"><option value="">全部部位</option></select>
        <select id="f-grade"><option value="">全部品级</option></select>
      </div>
      <div class="row">
        <label class="chk"><input id="f-edited" type="checkbox"> 只看已改</label>
        <button id="btn-clear-filter" class="ghost mini">清空筛选</button>
      </div>
    </div>
    <div id="list-info"></div>
    <div id="list"></div>
  </div>

  <div id="detail-pane">
    <div id="detail-head">
      <div class="grow">
        <div class="t" id="d-title">未选择装备</div>
        <div class="sub" id="d-sub">在左边挑一件装备，右边就能改它的各项属性</div>
      </div>
      <button id="btn-reset-item" class="ghost" disabled>还原此装备的改动</button>
    </div>
    <div id="detail-empty">← 先从左侧列表选一件装备</div>
    <div id="detail-body" class="hide"></div>
    <div id="preview-wrap" class="hide">
      <details class="preview">
        <summary>覆盖文件预览（保存时会写入 data/local-item-overrides.json）</summary>
        <pre id="preview"></pre>
      </details>
    </div>
  </div>
</main>

     · identifyFields = 鉴定槽位名与说明（lib/item-overrides.mjs 的 IDENTIFY_FIELD_LABELS）
   产出 data/local-item-overrides.json：
     · items    → 服务端在 lib/official-data.mjs 的 ensure() 末尾用 equipmentBytes
                  重写 definitionBase64
     · identify → 同一处重写 official.identification 的 slots + wireBase64
                  （客户端「查看鉴定范围」与服务端随机读的是同一行）
   ========================================================================== */
"use strict";

const DATA=JSON.parse(document.getElementById("item-editor-data").textContent||"{}");
const FIELDS=DATA.fields||[];
const GROUPS=DATA.groups||[];
const COLS=DATA.columns||[];
const TYPES=DATA.types||[];
const ATK_TYPES=DATA.atkTypes||[];
const POWERS=DATA.powers||{};
const MARKERS=new Set(DATA.powerMarkers||[]);
const IDENT_FIELDS=DATA.identifyFields||[];
const IDENT_BY_ID=new Map(Object.entries(DATA.identify||{}).map(([id,slots])=>[Number(id),slots]));
const COL={};COLS.forEach((k,i)=>COL[k]=i);

const $=s=>document.querySelector(s);
const isWeapon=type=>(type>=13&&type<=24)||(type>=34&&type<=39);
const typeName=t=>TYPES[t]||("类型 "+t);
const isMarker=id=>{
  if(!id)return false;
  const row=POWERS[String(id)];
  return !!(row&&row.marker)||MARKERS.has(Number(id));
};
const powerName=id=>{
  if(!id)return "（无）";
  const row=POWERS[String(id)];
  if(!row)return "编号 "+id+"（未知）";
  return id+" · "+row.n+(row.p?"（百分比）":"");
};
/** powerValue 字段对应的属性字段（powerValue1 ↔ power1 …）。 */
const pairedPowerKey=key=>{
  let m=/^powerValue([1-7])$/.exec(key);if(m)return "power"+m[1];
  m=/^bindPowerValue([12])$/.exec(key);if(m)return "bindPower"+m[1];
  m=/^enchantPowerValue([12])$/.exec(key);if(m)return "enchantPower"+m[1];
  return null;
};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- 状态 ---------------- */
const state={
  rows:DATA.items||[],            // 列式原始数据
  base:new Map(),                 // id -> Map(列名 -> 原值)
  edits:new Map(),                // id -> {fields:{...}, note:string, identify:{槽位:[[属性,最小,最大],…]}}
  selected:null,
  filter:{q:"",type:"",grade:"",edited:false},
  dir:null,                       // showDirectoryPicker 记住的目录
  readme:null,                    // 从已载入的覆盖文件里带过来的 _readme
  revision:null
};
for(const row of state.rows){
  const m=new Map();
  COLS.forEach((k,i)=>m.set(k,row[i]));
  state.base.set(row[COL.id],m);
}
const baseline=(id,key)=>state.base.get(id).get(key);
const entryOf=id=>state.edits.get(id)||null;
const fieldsOf=id=>entryOf(id)?.fields||null;
function entryFor(id){
  let entry=state.edits.get(id);
  if(!entry){entry={fields:{},note:"",identify:{}};state.edits.set(id,entry);}
  if(!entry.fields)entry.fields={};
  if(!entry.identify)entry.identify={};
  return entry;
}
function prune(id){
  const entry=entryOf(id);
  if(!entry)return;
  if(!Object.keys(entry.fields||{}).length&&!Object.keys(entry.identify||{}).length&&!entry.note)state.edits.delete(id);
}
const hasEdits=id=>{
  const entry=entryOf(id);
  return !!entry&&(Object.keys(entry.fields||{}).length>0||Object.keys(entry.identify||{}).length>0||!!entry.note);
};
const current=(id,key)=>{
  const f=fieldsOf(id);
  if(f&&Object.prototype.hasOwnProperty.call(f,key))return f[key];
  return baseline(id,key);
};
const isChanged=(id,key)=>{
  const f=fieldsOf(id);
  if(!f||!Object.prototype.hasOwnProperty.call(f,key))return false;
  const a=f[key],b=baseline(id,key);
  return String(a??"")!==String(b??"");
};
const editCount=()=>{
  let n=0;
  for(const id of state.edits.keys())if(hasEdits(id))n++;
  return n;
};
/* 鉴定范围：原值在 IDENT_BY_ID（内嵌自 official.identification），改动存 entry.identify。 */
const identBase=(id,field)=>((IDENT_BY_ID.get(id)||{})[field]||[]);
const identTouched=(id,field)=>{
  const entry=entryOf(id);
  return !!(entry&&entry.identify&&Object.prototype.hasOwnProperty.call(entry.identify,field));
};
const identList=(id,field)=>identTouched(id,field)?entryOf(id).identify[field]:identBase(id,field);
const identDirty=(id,field)=>identTouched(id,field)
  &&JSON.stringify(identList(id,field))!==JSON.stringify(identBase(id,field));
const identItemCount=()=>{
  let n=0;
  for(const id of state.edits.keys()){
    const entry=entryOf(id);
    if(entry&&Object.keys(entry.identify||{}).length)n++;
  }
  return n;
};

function status(html,kind){
  const el=$("#status");
  if(!html){el.style.display="none";return;}
  el.innerHTML=html;
  el.className=kind||"";
  el.style.display="block";
}
let toastTimer=null;
function toast(text){
  const el=$("#toast");
  el.textContent=text;el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),1900);
}

/* ---------------- 列表 ---------------- */
function renderFilters(){
  const types=new Map(),grades=new Map();
  for(const row of state.rows){
    const t=row[COL.type];types.set(t,(types.get(t)||0)+1);
    const g=row[COL.grade];grades.set(g,(grades.get(g)||0)+1);
  }
  const tSel=$("#f-type");
  [...types.entries()].sort((a,b)=>a[0]-b[0]).forEach(([t,n])=>{
    const o=document.createElement("option");o.value=t;o.textContent=typeName(t)+"（"+n+"）";tSel.appendChild(o);
  });
  const gSel=$("#f-grade");
  [...grades.entries()].sort((a,b)=>a[0]-b[0]).forEach(([g,n])=>{
    const o=document.createElement("option");o.value=g;o.textContent="品级 "+g+"（"+n+"）";gSel.appendChild(o);
  });
}

function visibleRows(){
  const q=state.filter.q.trim().toLowerCase();
  const out=[];
  for(const row of state.rows){
    const id=row[COL.id],name=row[COL.name]||"";
    if(state.filter.type!==""&&String(row[COL.type])!==state.filter.type)continue;
    if(state.filter.grade!==""&&String(row[COL.grade])!==state.filter.grade)continue;
    if(state.filter.edited&&!hasEdits(id))continue;
    if(q&&!(String(id).includes(q)||name.toLowerCase().includes(q)))continue;
    out.push(row);
  }
  return out;
}

function renderList(){
  const rows=visibleRows();
  const edited=editCount();
  $("#list-info").textContent=`${rows.length} / ${state.rows.length} 件 · 已改 ${edited} 件`;
  const html=[];
  for(const row of rows.slice(0,600)){
    const id=row[COL.id];
    const on=hasEdits(id);
    html.push(`<div class="item${id===state.selected?" active":""}${on?" edited":""}" data-id="${id}">`
      +`<span class="dot"></span>`
      +`<span class="nm">${esc(row[COL.name]||("未命名 "+id))}</span>`
      +`<span class="tag">${esc(typeName(row[COL.type]))}</span>`
      +`<span class="meta">${id}</span></div>`);
  }
  if(rows.length>600)html.push(`<div class="item" style="color:#9aa1ad;cursor:default">还有 ${rows.length-600} 件，用搜索或筛选缩小范围…</div>`);
  $("#list").innerHTML=html.join("")||`<div class="item" style="color:#9aa1ad;cursor:default">没有匹配的装备</div>`;
}

$("#list").addEventListener("click",event=>{
  const row=event.target.closest(".item[data-id]");
  if(!row)return;
  select(Number(row.dataset.id));
});

/* ---------------- 详情 ---------------- */
function select(id){
  state.selected=id;
  renderList();
  renderDetail();
}

const markerHint=id=>id===121?"鉴定格：鉴定时从下方「鉴定范围」里随机出一条"
  :id===131?"合成格：「免费装备合成」随机出一条"
  :id===181?"附魔卡标记"
  :"原版内部标记，不用改";

function fieldInput(field,id){
  const key=field.key;
  const value=current(id,key);
  const changed=isChanged(id,key);
  const cls=changed?" changed":"";
  const attrs=[`data-key="${key}"`,`data-kind="${field.kind}"`];
  if(field.min!==undefined)attrs.push(`min="${field.min}"`);
  if(field.max!==undefined)attrs.push(`max="${field.max}"`);
  let ctl="";
  let hint="";
  if(field.kind==="bool"){
    ctl=`<input type="checkbox" class="${cls}" ${value?"checked":""} ${attrs.join(" ")}>`;
  }else if(field.kind==="power"||field.kind==="atkType"){
    const list=field.kind==="power"
      ? [[0,"（无）"],...Object.keys(POWERS).map(Number).sort((a,b)=>a-b).map(k=>[k,powerName(k)])]
      : ATK_TYPES.map((n,i)=>[i,i+" · "+n]);
    if(field.kind==="power"&&value!=null&&!list.some(([k])=>k===Number(value)))list.push([Number(value),powerName(Number(value))]);
    ctl=`<select class="${cls}" ${attrs.join(" ")}>`
      +list.map(([k,label])=>`<option value="${k}"${Number(value)===k?" selected":""}>${esc(label)}</option>`).join("")
      +`</select>`;
    if(field.kind==="power"&&isMarker(Number(value)))hint=markerHint(Number(value));
  }else if(field.kind==="string"){
    if((field.max||0)>60){
      ctl=`<textarea class="${cls}" ${attrs.join(" ")}>${esc(value??"")}</textarea>`;
    }else{
      ctl=`<input type="text" class="${cls}" ${attrs.join(" ")} value="${esc(value??"")}" ${field.max?`maxlength="${field.max}"`:""}>`;
    }
  }else{
    ctl=`<input type="number" step="1" class="${cls}" ${attrs.join(" ")} value="${value??0}">`;
  }
  // 鉴定格 / 合成格的「数值」是原版内部标记编号（121 配 3960 这种），改了没有任何意义，
  // 直接禁用 + 说明，免得玩家以为那是个可以调的强度值。说明只挂 title：上面的属性格
  // 已经写了同一句，这里再铺一行只会把表单拉得更长。
  const paired=pairedPowerKey(key);
  if(paired&&isMarker(Number(current(id,paired)))){
    ctl=`<input type="number" ${attrs.join(" ")} value="${value??0}" disabled title="原版内部标记编号，不用改">`;
  }
  const base=baseline(id,key);
  const baseTxt=field.kind==="power"?(base?powerName(Number(base)):""):(base??"");
  const wrap=["field"];
  if(field.kind==="string"&&(field.max||0)>60)wrap.push("wide");
  if(field.kind==="power"||field.kind==="atkType"||hint)wrap.push("stack");
  return `<div class="${wrap.join(" ")}">`
    +`<label title="${esc(field.label)}${field.key}">${esc(field.label)}`
    +`${field.kind==="string"?"":`<span class="base">原 ${esc(baseTxt)}</span>`}</label>`
    +`<div class="ctl">${ctl}${hint?`<span class="hint">${esc(hint)}</span>`:""}</div></div>`;
}

function summaryHtml(id){
  const type=baseline(id,"type");
  const parts=[];
  const add=(k,v)=>{if(v!==null&&v!==undefined&&v!=="")parts.push(`<span class="k">${k}</span><span class="v">${esc(v)}</span>`);};
  add("编号",id);
  add("部位",typeName(type));
  add("品级",current(id,"grade"));
  add("需求等级",current(id,"reqLv"));
  if(isWeapon(type)){
    add("攻击",(current(id,"atkMin")??0)+" - "+(current(id,"atkMax")??0));
    add("攻击次数",(Number(current(id,"atk_time")||0)+1));
    add("攻击类型",ATK_TYPES[current(id,"atkType")]||"");
    add("命中",current(id,"hitrate"));
  }else{
    add("劈砍防御",current(id,"def_str"));
    add("穿刺防御",current(id,"def_agi"));
    add("魔法防御",current(id,"def_mag"));
  }
  for(const n of [1,2,3]){
    const power=Number(current(id,"power"+n)||0);
    const value=current(id,"powerValue"+n);
    if(!power)continue;
    if(isMarker(power)){
      const pool=(IDENT_BY_ID.get(id)||{})["power"+n]||[];
      const extra=pool.length?`（${pool.length} 条候选，见下方「鉴定范围」）`:"（见下方「鉴定范围」）";
      parts.push(`<span class="k">属性${n}</span><span class="v">${esc(powerName(power))}${esc(extra)}</span>`);
    }else{
      parts.push(`<span class="k">属性${n}</span><span class="v">${esc(powerName(power))} ${esc(value)}</span>`);
    }
  }
  add("耐久",current(id,"durMax"));
  add("宝石孔",current(id,"attachCount"));
  const skill=baseline(id,"skillName");
  if(skill)add("自带技能",skill+" Lv"+baseline(id,"skillLevel"));
  return parts.join(`<span class="sep">|</span>`);
}

/* ---------------- 鉴定范围（第 87 版） ---------------- */
function powerOptions(selected){
  const list=Object.keys(POWERS).map(Number)
    .filter(k=>!isMarker(k)||k===selected)
    .sort((a,b)=>a-b)
    .map(k=>[k,powerName(k)]);
  if(selected&&!list.some(([k])=>k===selected))list.push([selected,powerName(selected)]);
  return list.map(([k,label])=>`<option value="${k}"${k===selected?" selected":""}>${esc(label)}</option>`).join("");
}

function identifySlotFields(id){
  const base=IDENT_BY_ID.get(id)||{};
  const fields=[];
  for(const field of IDENT_FIELDS){
    const has=Object.prototype.hasOwnProperty.call(base,field.key);
    const marker=Number(current(id,field.key)||0);
    if(has||marker===121||marker===131)fields.push({...field,has,marker});
  }
  return {base,fields};
}

function identifySection(id){
  const {fields}=identifySlotFields(id);
  if(!fields.length)
    return `<section class="group" id="identify-section"><h2>鉴定范围（鉴定 / 合成时随机出的属性）</h2>`
      +`<div class="id-note">这件装备原版没有鉴定范围，也没有标成鉴定格（121）/ 合成格（131）的槽位 —— 没有可改的东西。</div></section>`;
  const shownNotes=new Set();
  const blocks=fields.map(field=>{
    const list=identList(id,field.key);
    const dirty=identDirty(id,field.key);
    const tag=field.marker===121?"鉴定格 121":field.marker===131?"合成格 131":"未标标记";
    const note=field.note||field.hint||"";
    const showNote=!!note&&!shownNotes.has(note);
    if(showNote)shownNotes.add(note);
    const rows=list.map((row,index)=>`<div class="id-opt" data-idx="${index}">`
      +`<select data-prop="power" title="属性编号">${powerOptions(Number(row[0]))}</select>`
      +`<input type="number" step="1" data-prop="min" value="${row[1]}" title="最小值">`
      +`<span class="tilde">~</span>`
      +`<input type="number" step="1" data-prop="max" value="${row[2]}" title="最大值">`
      +`<button class="mini ghost" data-act="id-del" data-field="${field.key}" data-idx="${index}" title="删掉这条">✕</button>`
      +`</div>`).join("");
    return `<div class="id-slot${dirty?" dirty":""}" data-field="${field.key}">`
      +`<div class="id-head">`
      +`<b>${esc(field.label)}</b><code>${esc(field.key)}</code>`
      +`<span class="tag">${esc(tag)}</span>`
      +`<span class="grow"></span>`
      +`<button class="mini ghost" data-act="id-add" data-field="${field.key}">+ 加一条</button>`
      +`<button class="mini ghost" data-act="id-restore" data-field="${field.key}"${dirty?"":" disabled"}>还原</button>`
      +`</div>`
      +(showNote?`<div class="id-hint">${esc(note)}</div>`:"")
      +(field.has?"":`<div class="id-note">原版没采到这件装备的这套范围（游戏里点「查看鉴定范围」会提示没有）—— 下面填的词条会新建一套。</div>`)
      +(rows?`<div class="id-opts">${rows}</div>`:`<div class="id-empty-slot">还没有候选词条，点「+ 加一条」加一条。</div>`)
      +`</div>`;
  }).join("");
  return `<section class="group" id="identify-section"><h2>鉴定范围（鉴定 / 合成时随机出的属性）</h2>`
    +`<div class="id-note">游戏里「查看鉴定范围」看到的、以及鉴定时实际随机到的，都是这张表。`
    +`每条 = 属性 + 数值区间（原版鉴定取的是上限）。改完保存 → 重启服务端生效。</div>`
    +`<div class="id-body">${blocks}</div></section>`;
}

function renderDetail(){
  const id=state.selected;
  const body=$("#detail-body");
  const head=$("#d-title");
  if(id==null){
    head.textContent="未选择装备";
    $("#d-sub").textContent="在左边挑一件装备，右边就能改它的各项属性";
    body.classList.add("hide");body.innerHTML="";
    $("#detail-empty").style.display="flex";
    $("#preview-wrap").classList.add("hide");
    $("#btn-reset-item").disabled=true;
    return;
  }
  const name=current(id,"name")||baseline(id,"name");
  const type=baseline(id,"type");
  head.textContent=name+"  ·  "+id;
  $("#d-sub").innerHTML=`<span class="tag">${esc(typeName(type))}</span> 改动会自动记在覆盖文件里；改的是定义，同一件装备的所有副本一起变。`;
  $("#detail-empty").style.display="none";
  body.classList.remove("hide");
  $("#preview-wrap").classList.remove("hide");
  $("#btn-reset-item").disabled=!hasEdits(id);

  const html=[`<div class="summary">${summaryHtml(id)}</div>`];
  for(const group of GROUPS){
    let list=FIELDS.filter(f=>f.group===group.id);
    if(group.id==="weapon"&&!isWeapon(type))continue;
    list=list.filter(f=>!(f.weapon&&!isWeapon(type)));
    if(!list.length)continue;
    html.push(`<section class="group"><h2>${esc(group.label)}</h2><div class="grid">`
      +list.map(f=>fieldInput(f,id)).join("")+`</div></section>`);
  }
  html.push(identifySection(id));
  body.innerHTML=html.join("");
  renderPreview();
}

/* ---------------- 编辑 ---------------- */
$("#detail-body").addEventListener("input",event=>{
  const el=event.target;
  if(state.selected==null)return;
  if(el.dataset.prop){applyIdentifyEdit(state.selected,el);return;}
  const key=el.dataset.key;
  if(!key)return;
  applyEdit(state.selected,key,el.dataset.kind,el);
});
$("#detail-body").addEventListener("change",event=>{
  const el=event.target;
  if(state.selected==null)return;
  if(el.dataset.prop){applyIdentifyEdit(state.selected,el);return;}
  const key=el.dataset.key;
  if(!key)return;
  applyEdit(state.selected,key,el.dataset.kind,el);
});
$("#detail-body").addEventListener("click",event=>{
  const btn=event.target.closest("[data-act]");
  if(!btn||btn.disabled||state.selected==null)return;
  const field=btn.dataset.field;
  if(!field)return;
  const id=state.selected;
  if(btn.dataset.act==="id-add")identAdd(id,field);
  else if(btn.dataset.act==="id-del")identRemove(id,field,Number(btn.dataset.idx));
  else if(btn.dataset.act==="id-restore")identRestore(id,field);
});

function applyEdit(id,key,kind,el){
  let value;
  if(kind==="bool")value=!!el.checked;
  else if(kind==="string")value=el.value;
  else if(kind==="power"||kind==="atkType")value=Number(el.value);
  else{
    const raw=el.value.trim();
    value=raw===""?0:Number(raw);
    if(!Number.isFinite(value)||!Number.isInteger(value)){
      toast("只能填整数");el.value=current(id,key)??0;return;
    }
  }
  const entry=entryFor(id);
  if(String(value)===String(baseline(id,key)??"")){
    delete entry.fields[key];
  }else{
    entry.fields[key]=value;
  }
  prune(id);

  el.classList.toggle("changed",isChanged(id,key));
  // 同步「原值」提示与摘要
  const baseEl=el.closest(".field")?.querySelector("label .base");
  if(baseEl){
    const base=baseline(id,key);
    const def=FIELDS.find(f=>f.key===key);
    baseEl.textContent="原 "+(def&&def.kind==="power"&&base?powerName(Number(base)):(base??""));
  }
  refreshAfterEdit(id,key);
}

/** 改完任意一项后的统一刷新：摘要、按钮、列表、预览；属性编号变了还要修配对字段与鉴定范围。 */
function refreshAfterEdit(id,key){
  const summary=$(".summary");
  if(summary)summary.innerHTML=summaryHtml(id);
  if(key&&/^(bind)?power[1-7]$/.test(key)){
    const pair=pairedValueKey(key);
    if(pair)replaceField(id,pair);
    replaceIdentifySection(id);
  }
  $("#btn-reset-item").disabled=!hasEdits(id);
  const count=editCount();
  $("#btn-download").disabled=!count;
  $("#btn-save").disabled=!count;
  $("#btn-reset-all").disabled=!count;
  renderList();
  renderPreview();
}

const pairedValueKey=key=>{
  let m=/^power([1-7])$/.exec(key);if(m)return "powerValue"+m[1];
  m=/^bindPower([12])$/.exec(key);if(m)return "bindPowerValue"+m[1];
  m=/^enchantPower([12])$/.exec(key);if(m)return "enchantPowerValue"+m[1];
  return null;
};

function replaceField(id,key){
  const field=FIELDS.find(f=>f.key===key);
  if(!field)return;
  const ctl=document.querySelector(`#detail-body [data-key="${key}"]`);
  const wrap=ctl&&ctl.closest(".field");
  if(wrap)wrap.outerHTML=fieldInput(field,id);
}

function replaceIdentifySection(id){
  const section=document.getElementById("identify-section");
  if(section)section.outerHTML=identifySection(id);
}

/* ---------------- 鉴定范围的编辑 ---------------- */
function setIdentify(id,field,list){
  const entry=entryFor(id);
  if(JSON.stringify(list)===JSON.stringify(identBase(id,field)))delete entry.identify[field];
  else entry.identify[field]=list;
  prune(id);
}

function applyIdentifyEdit(id,el){
  const slot=el.closest(".id-slot");
  if(!slot)return;
  const field=slot.dataset.field;
  const read=(row,prop)=>{
    const input=row.querySelector(`[data-prop="${prop}"]`);
    const n=Number(input?input.value:0);
    return Number.isFinite(n)?Math.trunc(n):0;
  };
  const list=[...slot.querySelectorAll(".id-opt")].map(row=>[read(row,"power"),read(row,"min"),read(row,"max")]);
  setIdentify(id,field,list);
  const dirty=identDirty(id,field);
  slot.classList.toggle("dirty",dirty);
  const restore=slot.querySelector('[data-act="id-restore"]');
  if(restore)restore.disabled=!dirty;
  refreshAfterEdit(id,null);
}

function identAdd(id,field){
  const list=identList(id,field).map(row=>[...row]);
  const last=list[list.length-1];
  list.push(last?[...last]:[1,0,0]);
  setIdentify(id,field,list);
  replaceIdentifySection(id);
  refreshAfterEdit(id,null);
}

function identRemove(id,field,index){
  const list=identList(id,field).map(row=>[...row]);
  list.splice(index,1);
  setIdentify(id,field,list);
  replaceIdentifySection(id);
  refreshAfterEdit(id,null);
}

function identRestore(id,field){
  const entry=entryOf(id);
  if(entry&&entry.identify)delete entry.identify[field];
  prune(id);
  replaceIdentifySection(id);
  refreshAfterEdit(id,null);
}

$("#btn-reset-item").onclick=()=>{
  if(state.selected==null)return;
  state.edits.delete(state.selected);
  renderDetail();renderList();

$("#btn-reset-all").onclick=()=>{

  $("#btn-save").disabled=true;

/* ---------------- 导出 ---------------- */
const DEFAULT_README=[
 "本地装备属性覆盖层。data/official-v305.json 是抓包产物（一字节不改），要改某件装备的",
 "属性就写在这里，由 lib/official-data.mjs 的 ensure() 在所有补丁合完之后、建索引之前套用。",
 "套用时会重算派生字段（powers / level / requirements / durability / attackTimes …）并用",
 "lib/character-import-codec.mjs 的 equipmentBytes 重写 definitionBase64 ——",
 "只改 JSON 不重写字节的话，客户端收到（以及服务端算属性时解码）的还是旧定义。",
 "",
 "items[道具id] = { _note: \"备注（可选）\", 字段: 值 }",
 "只写要改的字段，没写的保持原值；字段表见 lib/item-overrides.mjs 的 ITEM_FIELDS。",
 "",
 "identify[道具id] = { 槽位名: [ { power: 属性编号, min: 最小值, max: 最大值 }, … ] }",
 "槽位名只有 power1 / power2 / power3 / bindPower1 / bindPower2 / power4 … power7；",
 "空数组 = 去掉这个槽位。这一段改的是「鉴定时随机出哪些词条」：客户端点「查看鉴定范围」",
 "（12060 回包）与服务端随机（lib/item-affixes.mjs）读的是同一行，覆盖会同时重写",
 "slots 与 wireBase64。原版没采到范围的装备（如 13590 经验加成披风）也能新建一行，",
 "前提是定义里该槽位真的标成鉴定格 121 / 合成格 131，宠物装备不行。",
 "",
 "推荐直接用 装备编辑器.html 生成这份文件，不要手写。",
 "",
 "⚠ 改的是「定义」：同一件装备的所有副本一起变。存档里已鉴定的词条数值属于实例数据，",
 "   由游戏内的鉴定/合成改写（见 lib/item-affixes.mjs）。",
 "⚠ 存盘后要重启服务端（启动单机-新存档.cmd）才生效；APK 需重新打包。"
];

function revisionValue(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return "local-item-overrides-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-v1";
}

function buildOverrideObject(){
  const items={},identify={};
  const order=IDENT_FIELDS.map(f=>f.key);
  for(const id of [...state.edits.keys()].sort((a,b)=>a-b)){
    const e=entryOf(id);
    if(!e)continue;
    const keys=Object.keys(e.fields||{});
    if(keys.length){
      const entry={};
      if(e.note)entry._note=e.note;
      const sorted=keys.sort((a,b)=>{
        const ia=FIELDS.findIndex(f=>f.key===a),ib=FIELDS.findIndex(f=>f.key===b);
        return ia-ib;
      });
      for(const k of sorted)entry[k]=e.fields[k];
      items[String(id)]=entry;
    }
    const touched=Object.keys(e.identify||{});
    if(touched.length){
      const slots={};
      for(const field of order)if(touched.includes(field))
        slots[field]=e.identify[field].map(row=>({power:row[0],min:row[1],max:row[2]}));
      identify[String(id)]=slots;
    }
  }
  // identify 即使为空也写出来：让人一眼知道这份文件还能改鉴定范围。
  return {_readme:state.readme||DEFAULT_README,revision:revisionValue(),items,identify};
}
const buildOverrideText=()=>JSON.stringify(buildOverrideObject(),null,1)+"\n";

/** 鉴定范围的本地自查（服务端也会校验，但先把明显写错的挡住，免得存进去起不来）。 */
function identifyProblems(){
  const problems=[];
  for(const [id,e] of state.edits){
    for(const [field,list] of Object.entries(e.identify||{})){
      if(!list.length)continue;
      list.forEach((row,index)=>{
        const [power,min,max]=row;
        const at=`道具 ${id} 的 ${field} 第 ${index+1} 条`;
        if(!Number.isInteger(power)||power<=0)problems.push(`${at}：属性编号没选对`);
        else if(!Number.isInteger(min)||!Number.isInteger(max))problems.push(`${at}：最小值/最大值要填整数`);
        else if(min>max)problems.push(`${at}：最小值 ${min} 大于最大值 ${max}`);
        else if(min<-32768||max>32767)problems.push(`${at}：数值要在 -32768..32767 之间`);
      });
    }
  }
  return problems;
}

function renderPreview(){
  const obj=buildOverrideObject();
  const itemCount=Object.keys(obj.items).length,identCount=Object.keys(obj.identify||{}).length;
  $("#preview").textContent=(itemCount||identCount)
    ?JSON.stringify(obj,null,1)
    :"（还没有改动）\n\n改了左边任意一件装备的属性、或它的鉴定范围，这里会实时显示将要写出的覆盖条目。";
}

function download(name,text){
  const blob=new Blob([text],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

function reportProblems(){
  const problems=identifyProblems();
  if(!problems.length)return false;
  status(`<b>鉴定范围有问题，先改好再保存：</b><br>${problems.slice(0,6).map(esc).join("<br>")}${problems.length>6?"<br>…":""}`,"err");
  toast("鉴定范围有错，没保存");
  return true;
}

$("#btn-download").onclick=()=>{
  if(!editCount()){toast("还没有任何改动");return;}
  if(reportProblems())return;
  download("local-item-overrides.json",buildOverrideText());
  toast("已下载，请覆盖到 data/ 目录");
};

$("#btn-save").onclick=async()=>{
  if(!editCount()){toast("还没有任何改动");return;}
  if(reportProblems())return;
  const text=buildOverrideText();
  if(typeof window.showDirectoryPicker!=="function"){
    download("local-item-overrides.json",text);
    toast("这个浏览器不支持直接写文件，已下载");
    return;
  }
  try{
    let dir=state.dir;
    if(!dir){
      dir=await window.showDirectoryPicker({mode:"readwrite",id:"worldol-data"});
      state.dir=dir;
    }
    // 选错目录很常见：data/ 里一定有 official-v305.json，选完先看一眼。
    let looksLikeData=true;
    try{await dir.getFileHandle("official-v305.json");}catch{looksLikeData=false;}
    if(!looksLikeData&&!confirm("这个文件夹里没有 official-v305.json，看起来不是 data 目录。仍然写入吗？"))return;
    const handle=await dir.getFileHandle("local-item-overrides.json",{create:true});
    const writable=await handle.createWritable();
    await writable.write(text);await writable.close();
    const obj=buildOverrideObject();
    const itemCount=Object.keys(obj.items).length,identCount=Object.keys(obj.identify||{}).length;
    status(`已写入 <b>${dir.name}/local-item-overrides.json</b>（装备 ${itemCount} 件`
      +`${identCount?`、鉴定范围 ${identCount} 件`:""}）。`
      +`重启服务端（<b>启动单机-新存档.cmd</b>）后生效；打 APK 的话重新跑一次一键打包。`,"ok");
    toast("写入成功");
  }catch(error){
    if(error&&error.name==="AbortError"){return;}
    status("直接写入失败（"+esc(error.message)+"），已改为下载文件，请手动放进 data/ 目录。","err");
    download("local-item-overrides.json",text);
  }
};

/* ---------------- 载入已有覆盖 ---------------- */
$("#btn-load").onclick=()=>$("#file").click();
$("#file").addEventListener("change",async event=>{
  const file=event.target.files?.[0];
  event.target.value="";
  if(!file)return;
  try{
    const raw=JSON.parse(await file.text());
    if(!raw||typeof raw!=="object"||!raw.items||typeof raw.items!=="object")throw Error("缺少 items 对象");
    let applied=0,skipped=[];
    for(const [idRaw,entryRaw] of Object.entries(raw.items)){
      const id=Number(idRaw);
      if(!state.base.has(id)){skipped.push(idRaw);continue;}
      const entry={fields:{},note:typeof entryRaw._note==="string"?entryRaw._note:"",identify:{}};
      for(const [key,value] of Object.entries(entryRaw)){
        if(key==="_note")continue;
        if(!FIELDS.some(f=>f.key===key))continue;
        entry.fields[key]=value;
      }
      if(Object.keys(entry.fields).length||entry.note){state.edits.set(id,entry);applied++;}
    }
    // 鉴定范围：{ 道具id: { 槽位: [ {power,min,max}, … ] } }（也认 [编号,最小,最大] 数组）
    let identApplied=0,identSkipped=[];
    for(const [idRaw,slots] of Object.entries(raw.identify||{})){
      const id=Number(idRaw);
      if(!state.base.has(id)){identSkipped.push(idRaw);continue;}
      if(!slots||typeof slots!=="object"||Array.isArray(slots))continue;
      const entry=entryFor(id);
      let touched=0;
      for(const [field,list] of Object.entries(slots)){
        if(!IDENT_FIELDS.some(f=>f.key===field)||!Array.isArray(list))continue;
        entry.identify[field]=list.map(row=>Array.isArray(row)
          ?[Number(row[0])||0,Number(row[1])||0,Number(row[2])||0]
          :[Number(row?.power)||0,Number(row?.min)||0,Number(row?.max)||0]);
        touched++;
      }
      if(touched)identApplied++;
      else prune(id);
    }
    if(Array.isArray(raw._readme))state.readme=raw._readme;
    state.revision=raw.revision||null;
    renderList();renderDetail();
    $("#btn-download").disabled=!editCount();
    $("#btn-save").disabled=!editCount();
    $("#btn-reset-all").disabled=!editCount();
    const missingIds=[...new Set([...skipped,...identSkipped])];
    status(`已载入 <b>${esc(file.name)}</b>：${applied} 件装备的属性覆盖`
      +(identApplied?`、${identApplied} 件装备的鉴定范围`:"")+`。`
      +(missingIds.length?`<br>跳过 ${missingIds.length} 条目录里没有的道具编号：${esc(missingIds.slice(0,8).join("、"))}${missingIds.length>8?"…":""}`:""),
      missingIds.length?"":"ok");
    toast("载入完成");
  }catch(error){
    status("载入失败："+esc(error.message),"err");
  }
});

    +`改完点 <b>保存到 data 目录…</b>，选 <b>世界online_原版单机/data</b>，然后重启服务端即可生效。`

})();
