<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>怪物编队编辑器 · 世界OL 单机版</title>
<style>
  :root{--bg:#10162a;--panel:#1b2340;--panel2:#151c33;--line:#36477a;--line2:#4a6db8;
    --text:#dfe7f7;--dim:#8fa3c8;--gold:#ffe9a8;--gold2:#c8a34d;--ok:#7fd18a;--err:#ff8f8f;
    --btn:#2e4270;--btn2:#3b5aa6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 "Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;
    background:linear-gradient(#1d2748,#161e36);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:17px;color:var(--gold)}
  header .ver{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
  header .grow{flex:1}
  button{background:var(--btn);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px}
  button:hover{background:var(--btn2)}
  button.primary{background:#2f5ea8;border-color:#6f9fe8}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.danger{border-color:#7d3f3f;color:var(--err)}
  main{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 52px)}
  aside{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column}
  aside .head{padding:7px;border-bottom:1px solid var(--line);display:flex;gap:6px}
  aside .list{overflow:auto;flex:1;padding:5px}
  aside .item{display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:5px;cursor:pointer;font-size:12px}
  aside .item:hover{background:#222c4d}
  aside .item.active{background:#35467a;border-color:var(--gold2)}
  aside .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  section{padding:12px 16px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:11px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--gold)}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
  .row label{color:var(--dim);font-size:12px;min-width:96px}
  input,select{background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px}
  input[type=number]{width:92px}
  .grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
  .slot{background:#0e1526;border:1px solid var(--line);border-radius:7px;padding:7px;text-align:center}
  .slot .pos{font-size:11px;color:var(--dim);margin-bottom:4px}
  .slot .nm{font-size:12px;color:var(--gold);min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .lv{font-size:11px;color:var(--dim)}
  .slot input{width:100%;text-align:center}
  .slot .clr{font-size:11px;color:var(--dim);cursor:pointer}
  .slot .clr:hover{color:var(--err)}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
  .empty{color:var(--dim);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:9px}
  #status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:80vw;padding:7px 13px;border-radius:7px;
    font-size:12px;display:none;z-index:20;background:#222c4d;border:1px solid var(--line2)}
  #status.ok{border-color:#3f7d4d;background:#1b3326;color:var(--ok)}
  #status.err{border-color:#7d3f3f;background:#331b1b;color:var(--err)}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2f5ea8;color:#fff;padding:7px 15px;
    border-radius:7px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  #toast.show{opacity:1}
  pre{background:#0e1526;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;overflow:auto;color:var(--dim)}
</style>
</head>

<script>
"use strict";
/* ============================================================
 * 怪物编队编辑器（第 96 版）
 *
 * 数据流：data/local-encounters.json ⇄ 本编辑器
 * 生效链：lib/local-encounters.mjs → official-data.ensure() 里
 *         往 official.groups 注册编队（battleGroupWire 现编字节）
 *         + 把 replaceMission 指向的任务 acceptBattleID 改成你的编队
 * 打法：从原来的入口接那条任务（如 boss 直达里的挑战），打的就是你的编队。
 * ============================================================ */
const LABELS = JSON.parse(document.getElementById('encounter-labels').textContent);
const MISSIONS = (LABELS.missions || []).slice().sort((a, b) => a.id - b.id);
const REVISION = 'local-encounters-20261025-v1';
const GROUP_MIN = 30100, GROUP_MAX = 30199;

const state = { encounters: [], selected: null, dirHandle: null, nextId: GROUP_MIN };

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
let toastTimer = null;
function toast(m, ms = 2000) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function status(m, k = '') { const s = $('#status'); if (!m) { s.style.display = 'none'; return; } s.className = k; s.innerHTML = m; s.style.display = 'block'; }

function normalizeIncoming(raw) {
  const out = [];
  const src = raw && Array.isArray(raw.encounters) ? raw.encounters : [];
  for (const item of src) {
    if (!item || typeof item !== 'object') continue;
    const monsters = new Array(10).fill(0);
    if (Array.isArray(item.monsters)) for (let i = 0; i < 10 && i < item.monsters.length; i++) monsters[i] = Number(item.monsters[i]) || 0;
    if (!monsters.some(id => id > 0)) continue;
    out.push({
      name: String(item.name || '').slice(0, 20) || ('编队 ' + out.length),
      groupId: Number(item.groupId) || 0,
      monsters,
      npcs: Array.isArray(item.npcs) ? item.npcs.slice(0, 4) : [],
      flag: Number(item.flag) || 0,
      coefficient: Number(item.coefficient) || 0,
      replaceMission: Number(item.replaceMission) || null
    });
  }
  return out;
}
function buildConfigText() {
  return JSON.stringify({
    _readme: [
      "自定义怪物编队（第 96 版）。设计 10 格编队（用已有怪物），并替换某条挑战任务 ——",
      "这样从原来的入口接那条任务，打的就是你的编队。",
      "encounters[] = { name, groupId(30100-30199), monsters[10], npcs[], flag, coefficient, replaceMission }",
      "编队字节由 lib/local-encounters.mjs 用 battleGroupWire 现编；读取方见同一文件。",
      "由 怪物编队编辑器.html 生成。"
    ],
    revision: REVISION,
    encounters: state.encounters.filter(e => e.monsters.some(id => id > 0)).map(e => ({
      name: e.name, groupId: e.groupId, monsters: e.monsters, npcs: e.npcs,
      flag: e.flag, coefficient: e.coefficient, replaceMission: e.replaceMission || null
    }))
  }, null, 1) + "\n";
}
async function loadFromDir() {
  if (typeof window.showDirectoryPicker !== 'function') {
    status("这个浏览器不支持直接读目录（需要 Chrome/Edge）。可改用「下载配置」再放进 data/。", "err");
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'worldol-data' });
    state.dirHandle = dir;
    let raw = null;
    try {
      const fh = await dir.getFileHandle('local-encounters.json');
      raw = JSON.parse(await (await fh.getFile()).text());
    } catch (err) {
      if (err && err.name !== 'NotFoundError' && err.name !== 'TypeError') throw err;
    }
    state.encounters = normalizeIncoming(raw);
    state.selected = state.encounters[0] || null;
    assignIds();
    $("#btn-save").disabled = false;
    $("#btn-download").disabled = false;
    renderList(); renderEditor();
    status(raw ? ('已载入 ' + state.encounters.length + ' 个编队。改完保存，重启游戏生效。') : '目录里还没有配置文件，已从空白开始。', 'ok');
  } catch (err) {
    if (err && err.name === 'AbortError') { state.dirHandle = null; return; }
    status('读取失败：' + (err && err.message || err), 'err');
  }
}
async function save() {
  const text = buildConfigText();
  if (state.dirHandle) {
    try {
      const fh = await state.dirHandle.getFileHandle('local-encounters.json', { create: true });
      const w = await fh.createWritable();
      await w.write(text); await w.close();
      const n = JSON.parse(text).encounters.length;
      status('已写入 <b>local-encounters.json</b>（' + n + ' 个编队）。重启游戏（电脑版）或重新打包（APK）生效。', 'ok');
      toast('写入成功');
      return;
    } catch (err) {
      status('直接写入失败（' + (err && err.message || err) + '），已改为下载文件。', 'err');
    }
  }
  download('local-encounters.json', text);
  toast('已下载，请放进 data/ 目录');
}
function download(name, text) {
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function assignIds() {
  const used = new Set();
  for (const e of state.encounters) if (e.groupId >= GROUP_MIN && e.groupId <= GROUP_MAX) used.add(e.groupId);
  let next = GROUP_MIN;
  for (const e of state.encounters) {
    if (!(e.groupId >= GROUP_MIN && e.groupId <= GROUP_MAX) || used.has('dup-' + e.groupId)) {
      while (used.has(next) && next <= GROUP_MAX) next++;
      e.groupId = next; used.add(next);
    }
  }
  while (used.has(state.nextId)) state.nextId++;
}
function renderList() {
  const list = $('#list');
  list.innerHTML = '';
  if (!state.encounters.length) { list.appendChild(el('div', 'hint', '还没有编队，点上面「+ 新建编队」')); return; }
  for (const e of state.encounters) {
    const filled = e.monsters.filter(id => id > 0).length;
    const item = el('div', 'item' + (state.selected === e ? ' active' : ''));
    item.appendChild(el('span', 'nm', e.name));
    item.appendChild(el('span', 'nm', filled + '/10'));
    item.onclick = () => { state.selected = e; renderList(); renderEditor(); };
    list.appendChild(item);
  }
}
function monsterName(id) {
  const opt = document.querySelector('#monster-list option[value="' + id + '"]');
  return opt ? opt.textContent : ('未知 ' + id);
}
function renderEditor() {
  const pane = $('#editor');
  pane.innerHTML = '';
  const e = state.selected;
  if (!e) { pane.appendChild(el('div', 'empty', '左边新建或选一个编队开始设计')); return; }

  const base = el('div', 'card');
  base.appendChild(el('h2', null, '编队信息'));
  const r1 = el('div', 'row');
  r1.appendChild(el('label', null, '名称'));
  const nm = document.createElement('input'); nm.type = 'text'; nm.maxLength = 20; nm.value = e.name; nm.style.width = '180px';
  nm.onchange = () => { e.name = nm.value.trim() || ('编队 ' + e.groupId); renderList(); };
  r1.appendChild(nm);
  r1.appendChild(el('label', null, '编队号'));
  const gid = document.createElement('input'); gid.type = 'number'; gid.min = String(GROUP_MIN); gid.max = String(GROUP_MAX); gid.value = e.groupId;
  gid.onchange = () => {
    let v = Number(gid.value);
    if (!Number.isInteger(v) || v < GROUP_MIN || v > GROUP_MAX) { v = e.groupId; toast('编队号必须在 ' + GROUP_MIN + '—' + GROUP_MAX); }
    if (state.encounters.some(x => x !== e && x.groupId === v)) { v = e.groupId; toast('编队号已被占用'); }
    e.groupId = v; gid.value = v; renderList();
  };
  r1.appendChild(gid);
  base.appendChild(r1);

  const r2 = el('div', 'row');
  r2.appendChild(el('label', null, '替换哪条挑战'));
  const sel = document.createElement('select');
  sel.style.minWidth = '320px';
  const optNone = document.createElement('option'); optNone.value = ''; optNone.textContent = '（不替换，只注册）';
  sel.appendChild(optNone);
  for (const m of MISSIONS) {
    const o = document.createElement('option');
    o.value = String(m.id);
    o.textContent = m.id + ' · ' + (m.name || '') + '（打 ' + m.group + '）';
    sel.appendChild(o);
  }
  sel.value = e.replaceMission ? String(e.replaceMission) : '';
  sel.onchange = () => { e.replaceMission = sel.value ? Number(sel.value) : null; renderEditor(); };
  r2.appendChild(sel);
  base.appendChild(r2);
  base.appendChild(el('div', 'hint', '选一条挑战后，从原来能接它的地方（boss 直达 / 征战广场等）接任务，打的就是这个编队。'));

  const r3 = el('div', 'row');
  r3.appendChild(el('label', null, '标记 flag'));
  const flag = document.createElement('input'); flag.type = 'number'; flag.min = '0'; flag.max = '3'; flag.value = e.flag;
  flag.onchange = () => { e.flag = Math.max(0, Math.min(3, Number(flag.value) || 0)); flag.value = e.flag; };
  r3.appendChild(flag);
  r3.appendChild(el('label', null, '强度系数'));
  const coef = document.createElement('input'); coef.type = 'number'; coef.min = '0'; coef.max = '9999'; coef.value = e.coefficient;
  coef.onchange = () => { e.coefficient = Math.max(0, Math.min(9999, Math.round(Number(coef.value) || 0))); coef.value = e.coefficient; };
  r3.appendChild(coef);
  r3.appendChild(el('span', 'hint', 'flag=3 时启用 NPC 槽（大部分自定义编队用 0 即可）'));
  base.appendChild(r3);
  pane.appendChild(base);

  const gridCard = el('div', 'card');
  gridCard.appendChild(el('h2', null, '编队（10 格，输入怪物 id 或从下拉里选）'));
  const grid = el('div', 'grid10');
  for (let i = 0; i < 10; i++) {
    const slot = el('div', 'slot');
    slot.appendChild(el('div', 'pos', '第 ' + (i + 1) + ' 格'));
    const id = e.monsters[i] || 0;
    slot.appendChild(el('div', 'nm', id > 0 ? monsterName(id) : '（空）'));
    const inp = document.createElement('input');
    inp.type = 'number'; inp.setAttribute('list', 'monster-list');
    inp.value = id > 0 ? id : '';
    inp.placeholder = '怪物 id';
    inp.onchange = () => {
      const v = Number(inp.value) || 0;
      if (v > 0 && !document.querySelector('#monster-list option[value="' + v + '"]')) { toast('没有这只怪：' + v); inp.value = id || ''; return; }
      e.monsters[i] = v; renderList(); renderEditor();
    };
    slot.appendChild(inp);
    const clr = el('div', 'clr', '清空');
    clr.onclick = () => { e.monsters[i] = 0; renderList(); renderEditor(); };
    slot.appendChild(clr);
    grid.appendChild(slot);
  }
  gridCard.appendChild(grid);
  gridCard.appendChild(el('div', 'hint', '空位不需要填。整队可以只放 1 只怪，也可以铺满 10 只。'));
  pane.appendChild(gridCard);

  const actions = el('div', 'card');
  actions.appendChild(el('h2', null, '其他'));
  const del = el('button', 'danger', '删除这个编队');
  del.onclick = () => {
    state.encounters = state.encounters.filter(x => x !== e);
    state.selected = state.encounters[0] || null;
    renderList(); renderEditor(); toast('已删除');
  };
  actions.appendChild(del);
  actions.appendChild(el('div', 'hint',
    '· 保存后重启游戏生效；战斗里遇到的敌人数量按你填的格子来（空位不生成怪物）。\n' +
    '· 「替换哪条挑战」不填只是注册编队，不会被任何入口用到。\n' +
    '· 编队号 30100—30199 是我们自定义的保留段，不会和原版/守卫挑战撞号。'));
  pane.appendChild(actions);
}

$('#btn-load').onclick = loadFromDir;
$('#btn-save').onclick = save;
$('#btn-download').onclick = () => { download('local-encounters.json', buildConfigText()); toast('已下载，请放进 data/ 目录'); };
$('#btn-add').onclick = () => {
  const e = { name: '新编队 ' + (state.encounters.length + 1), groupId: state.nextId, monsters: new Array(10).fill(0), npcs: [], flag: 0, coefficient: 0, replaceMission: null };
  state.encounters.push(e); state.selected = e; assignIds();
  renderList(); renderEditor();
};
$('#btn-save').disabled = false;
$('#btn-download').disabled = false;
renderList(); renderEditor();
status('新建编队 → 填 10 格怪物 → 选「替换哪条挑战」→ 保存到 data/。', '');
</script>
</body>
</html>
