<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>怪物编辑器 · 世界OL 单机版</title>
<style>
  :root{--bg:#10162a;--panel:#1b2340;--panel2:#151c33;--line:#36477a;--line2:#4a6db8;
    --text:#dfe7f7;--dim:#8fa3c8;--gold:#ffe9a8;--gold2:#c8a34d;--ok:#7fd18a;--err:#ff8f8f;
    --btn:#2e4270;--btn2:#3b5aa6;--chg:#ffd76e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 "Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;
    background:linear-gradient(#1d2748,#161e36);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:17px;color:var(--gold)}
  header .ver{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
  header .grow{flex:1}
  button{background:var(--btn);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px}
  button:hover{background:var(--btn2)}
  button.primary{background:#2f5ea8;border-color:#6f9fe8}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{display:grid;grid-template-columns:236px 1fr;height:calc(100vh - 52px)}
  aside{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column}
  aside .search{padding:7px;border-bottom:1px solid var(--line)}
  aside input{width:100%;background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:12px}
  aside .list{overflow:auto;flex:1;padding:5px}
  aside .item{display:flex;gap:6px;align-items:center;padding:5px 7px;border:1px solid transparent;border-radius:5px;cursor:pointer;font-size:12px}
  aside .item:hover{background:#222c4d}
  aside .item.active{background:#35467a;border-color:var(--gold2)}
  aside .item .id{color:var(--dim);min-width:38px}
  aside .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .item.changed .nm{color:var(--chg)}
  aside .pager{display:flex;align-items:center;gap:6px;padding:6px 7px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
  aside .pager button{padding:2px 7px;font-size:11px}
  aside .pager .info{flex:1;text-align:center;white-space:nowrap}
  .born{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:3px 8px}
  .born label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text);cursor:pointer;padding:2px 0}
  .born input{accent-color:#6f9fe8}
  .bornnum{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--dim)}
  .bornnum b{color:var(--gold);font-weight:normal}
  .airow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 0;border-top:1px dashed var(--line)}
  .airow:first-of-type{border-top:0}
  .airow .tag{font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:1px 7px}
  .airow input{width:74px;background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;text-align:right}
  .airow .sn{font-size:11px;min-width:88px}
  .airow .sn.ok{color:var(--ok)}
  .airow .sn.err{color:var(--err)}
  section{padding:12px 16px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:11px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px 12px}
  .f{display:flex;align-items:center;gap:6px}
  .f label{flex:1;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .f input{width:104px;background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;text-align:right}
  .f input.dirty{border-color:var(--gold);color:var(--chg);background:#221d12}
  .f .revert{font-size:11px;color:var(--dim);cursor:pointer;padding:0 3px}
  .f .revert:hover{color:var(--gold)}
  .empty{color:var(--dim);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:9px}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .bar .tag{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;color:var(--dim)}
  #status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:80vw;padding:7px 13px;border-radius:7px;
    font-size:12px;display:none;z-index:20;background:#222c4d;border:1px solid var(--line2)}
  #status.ok{border-color:#3f7d4d;background:#1b3326;color:var(--ok)}
  #status.err{border-color:#7d3f3f;background:#331b1b;color:var(--err)}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2f5ea8;color:#fff;padding:7px 15px;
    border-radius:7px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  #toast.show{opacity:1}
</style>
</head>

</main>

      skill2: {id: r.skill2.id, level: r.skill2.level},
      targetType: r.targetType
    }))};
  }
  const out = {
    _readme: [
      "怪物覆盖（第 96 版）：属性 + 天生状态 + 技能/AI。改运行时数据，不动 data/official-v305.json 原始抓包。",
      "monsters[怪物id] = { 字段:值 }：只写改过的字段。可改字段见 lib/local-monster-overrides.mjs。",
      "ai[怪物id] = { rounds:[ { skill1:{id,level}, skill2:{id,level}, targetType } ] }：",
      "  决定这只怪战斗里放什么技能（第几轮用哪个技能）；不写 msg 就沿用原版台词。",
      "  技能必须存在同 id 同等级的定义，否则战斗包里不会发这条技能，服务端会把它清零并打日志。",
      "  读取方 lib/local-monster-ai-overrides.mjs + lib/ai-wire.mjs（AI 记录按客户端 MonsterAI 字段重编码）。",
      "天生状态 bornStatus 是位图：位值 = 2^状态编号（中毒=2、定身=256、无敌=2097152…）。",
      "由 怪物编辑器.html 生成。"
    ],
    revision: REVISION,
    monsters
  };
  if (Object.keys(ai).length) out.ai = ai;
  return JSON.stringify(out, null, 1) + "\n";
}
async function loadFromDir() {
  if (typeof window.showDirectoryPicker !== 'function') {
    status("这个浏览器不支持直接读目录（需要 Chrome/Edge）。可改用「下载配置」再放进 data/。", "err");
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'worldol-data' });
    state.dirHandle = dir;
    let raw = null;
    try {
      const fh = await dir.getFileHandle('local-monster-overrides.json');
      raw = JSON.parse(await (await fh.getFile()).text());
    } catch (err) {
      if (err && err.name !== 'NotFoundError' && err.name !== 'TypeError') throw err;
    }
    const parsed = normalizeIncoming(raw);
    state.edits = parsed.monsters;
    state.aiEdits = parsed.ai;
    $("#btn-save").disabled = false;
    $("#btn-download").disabled = false;
    renderList(); renderEditor();
    const n = Object.keys(state.edits).length;
    const an = Object.keys(state.aiEdits).length;
    status(raw ? ("已载入配置（" + n + " 只怪改过属性，" + an + " 只怪改过技能/AI）。改完点<b>保存到 data/</b>，重启游戏生效。") : "目录里还没有配置文件，已从空白开始。", "ok");
  } catch (err) {
    if (err && err.name === 'AbortError') { state.dirHandle = null; return; }
    status("读取失败：" + (err && err.message || err), "err");
  }
}
async function save() {
  const text = buildConfigText();
  if (state.dirHandle) {
    try {
      const fh = await state.dirHandle.getFileHandle('local-monster-overrides.json', { create: true });
      const w = await fh.createWritable();
      await w.write(text); await w.close();
      const n = Object.keys(JSON.parse(text).monsters).length;
      status("已写入 <b>local-monster-overrides.json</b>（" + n + " 只怪）。重启游戏（电脑版）或重新打包（APK）生效。", "ok");
      toast("写入成功");
      return;
    } catch (err) {
      status("直接写入失败（" + (err && err.message || err) + "），已改为下载文件。", "err");
    }
  }
  download('local-monster-overrides.json', text);
  toast("已下载，请放进 data/ 目录");
}
function download(name, text) {
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 列表 ─────────────────────────────────────────────── */
function filtered() {
  const q = ($('#q').value || '').trim().toLowerCase();
  if (!q) return MONSTERS;
  return MONSTERS.filter(m => String(m.id).includes(q) || String(m.name || '').toLowerCase().includes(q));
}
function renderPager(total, pages) {
  const box = $('#pager');
  box.innerHTML = '';
  const prev = el('button', null, '‹ 上一页');
  prev.disabled = state.page <= 1;
  prev.onclick = () => { if (state.page > 1) { state.page--; state.resetScroll = true; renderList(); } };
  const next = el('button', null, '下一页 ›');
  next.disabled = state.page >= pages;
  next.onclick = () => { if (state.page < pages) { state.page++; state.resetScroll = true; renderList(); } };
  box.appendChild(prev);
  box.appendChild(el('span', 'info', '第 ' + state.page + '/' + pages + ' 页 · 共 ' + total + ' 只'));
  box.appendChild(next);
}
function renderList() {
  const list = $('#list');
  list.innerHTML = '';
  const all = filtered();
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;
  const start = (state.page - 1) * PAGE_SIZE;
  const rows = all.slice(start, start + PAGE_SIZE);
  renderPager(all.length, pages);
  if (!rows.length) { list.appendChild(el('div', 'hint', '没有匹配的怪物')); return; }
  if (state.resetScroll) { list.scrollTop = 0; state.resetScroll = false; }
  for (const m of rows) {
    const changed = state.edits[m.id] && Object.keys(state.edits[m.id]).length;
    const item = el('div', 'item' + (state.selected === m.id ? ' active' : '') + (changed ? ' changed' : ''));
    item.appendChild(el('span', 'id', String(m.id)));
    item.appendChild(el('span', 'nm', m.name || '(无名)'));
    const lv = el('span', 'id', 'Lv' + (state.edits[m.id] && state.edits[m.id].level != null ? state.edits[m.id].level : m.level));
    item.appendChild(lv);
    item.onclick = () => { state.selected = m.id; renderList(); renderEditor(); };
    list.appendChild(item);
  }
}

/* ── 编辑区 ───────────────────────────────────────────── */
function currentValue(id, field) {
  const e = state.edits[id];
  if (e && Object.prototype.hasOwnProperty.call(e, field)) return e[field];
  const o = ORIGINAL.get(id);
  return o ? o[field] : '';
}
function renderEditor() {
  const pane = $('#editor');
  pane.innerHTML = '';
  if (!state.selected) { pane.appendChild(el('div', 'empty', '左边选一只怪开始编辑')); return; }
  const id = state.selected;
  const origin = ORIGINAL.get(id);
  if (!origin) { pane.appendChild(el('div', 'empty', '未知怪物')); return; }

  const bar = el('div', 'bar');
  const t = el('h2', null, (currentValue(id, 'name') || origin.name));
  bar.appendChild(t);
  bar.appendChild(el('span', 'tag', 'id ' + id));
  bar.appendChild(el('span', 'tag', '原版 Lv' + origin.level + ' · HP ' + origin.hpMax));
  const changedCount = state.edits[id] ? Object.keys(state.edits[id]).length : 0;
  if (changedCount) bar.appendChild(el('span', 'tag', '已改 ' + changedCount + ' 项'));
  const resetAll = el('button', null, '恢复整只怪');
  resetAll.onclick = () => { delete state.edits[id]; renderList(); renderEditor(); toast('已恢复为原版数值'); };
  bar.appendChild(resetAll);
  pane.appendChild(bar);
  pane.appendChild(el('div', 'hint', '输入框右边灰色小字是原版值；改过的字段会变金色。只保存改过的字段。'));

  for (const [gname, fields] of GROUPS) {
    const card = el('div', 'card');
    card.appendChild(el('h2', null, gname));
    const grid = el('div', 'grid');
    for (const [field, label] of fields) {
      const wrap = el('div', 'f');
      const lab = el('label', null, label);
      lab.title = field;
      wrap.appendChild(lab);
      const inp = document.createElement('input');
      inp.type = (field === 'name') ? 'text' : 'number';
      const cur = currentValue(id, field);
      inp.value = cur == null ? '' : cur;
      inp.placeholder = String(origin[field] == null ? '' : origin[field]);
      const dirty = state.edits[id] && Object.prototype.hasOwnProperty.call(state.edits[id], field);
      if (dirty) inp.classList.add('dirty');
      inp.onchange = () => {
        const lim = LIMITS[field];
        let v = field === 'name' ? inp.value.trim() : Number(inp.value);
        if (field === 'name') { if (!v) { inp.value = origin.name; return; } }
        else {
          if (!Number.isFinite(v)) { inp.value = origin[field]; return; }
          v = Math.round(v);
          if (v < 0) v = 0;
          if (lim && v > lim) { v = lim; toast(label + ' 上限 ' + lim + '，已截断'); }
        }
        inp.value = v;
        state.edits[id] = state.edits[id] || {};
        const origVal = origin[field];
        if (String(v) === String(origVal)) delete state.edits[id][field];
        else state.edits[id][field] = v;
        if (!Object.keys(state.edits[id]).length) delete state.edits[id];
        renderList();
        renderEditor();
      };
      wrap.appendChild(inp);
      const rev = el('span', 'revert', '↺');
      rev.title = '恢复此字段';
      rev.onclick = () => {
        if (state.edits[id]) { delete state.edits[id][field]; if (!Object.keys(state.edits[id]).length) delete state.edits[id]; }
        renderList(); renderEditor();
      };
      wrap.appendChild(rev);
      grid.appendChild(wrap);
    }
    card.appendChild(grid);
    pane.appendChild(card);
  }
  renderBornCard(pane, id, origin);
  renderAiCard(pane, id);
  const tip = el('div', 'card');
  tip.appendChild(el('h2', null, '说明'));
  tip.appendChild(el('div', 'hint',
    '· 只改「改过的字段」，没动过的字段不进配置文件（保持原版）。\n' +
    '· 攻击次数 atk_time 原版存的是「次数 - 1」（想打 3 次就填 2）。\n' +
    '· 天生状态是位图，页面上按状态名勾选就行（位值 = 2^状态编号）。\n' +
    '· 技能/AI 段改的是战斗里「第几轮放哪个技能」；技能 id 与等级必须成对存在，否则服务端会把它清零并打日志。\n' +
    '· 保存后：电脑版重启服务端生效；APK 需要重新打包。战斗里第一次遇到这只怪就是新数值。\n' +
    '· 条目数据（怪物/AI/技能索引）由 tools/build-monster-editor-data.mjs 从 data/official-v305.json 重新生成。'));
  pane.appendChild(tip);
}


/* ── 天生状态（位图 → 勾选） ───────────────────────────── */
function bornValueOf(id, origin) {
  const v = Number(currentValue(id, 'bornStatus'));
  return Number.isFinite(v) && v >= 0 ? Math.trunc(v) : Number(origin.bornStatus || 0);
}
function writeBorn(id, origin, value) {
  const origVal = Number(origin.bornStatus || 0);
  state.edits[id] = state.edits[id] || {};
  if (value === origVal) delete state.edits[id].bornStatus;
  else state.edits[id].bornStatus = value;
  if (!Object.keys(state.edits[id]).length) delete state.edits[id];
}
function renderBornCard(pane, id, origin) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '天生状态（可多选）'));
  const origVal = Number(origin.bornStatus || 0);
  let value = bornValueOf(id, origin);
  const grid = el('div', 'born');
  const num = document.createElement('input');
  const names = el('span', null, '');
  const paintNames = () => {
    const picked = BORN_STATES.filter(function (pair) { return hasBit(value, bornBit(pair[0])); }).map(function (pair) { return pair[1]; });
    names.textContent = picked.length ? '（' + picked.join('、') + '）' : '（无天生状态）';
  };
  for (const [bid, name] of BORN_STATES) {
    const bit = bornBit(bid);
    const wrap = el('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = hasBit(value, bit);
    cb.onchange = () => {
      value = cb.checked ? value + bit : value - bit;
      if (value < 0) value = 0;
      cb.checked = hasBit(value, bit);
      num.value = String(value);
      paintNames();
      writeBorn(id, origin, value);
      renderList();
    };
    wrap.appendChild(cb);
    wrap.appendChild(document.createTextNode(name));
    wrap.title = '状态编号 ' + bid + '，位值 ' + bit;
    grid.appendChild(wrap);
  }
  card.appendChild(grid);

  const line = el('div', 'bornnum');
  line.appendChild(document.createTextNode('数值：'));
  num.type = 'number'; num.min = '0'; num.step = '1'; num.value = String(value);
  num.style.width = '150px'; num.style.textAlign = 'right';
  num.style.background = '#0e1526'; num.style.color = 'var(--text)';
  num.style.border = '1px solid var(--line)'; num.style.borderRadius = '4px';
  num.style.padding = '3px 6px'; num.style.fontSize = '12px';
  num.onchange = () => {
    let v = Number(num.value);
    if (!Number.isFinite(v) || v < 0) v = origVal;
    v = Math.trunc(v);
    writeBorn(id, origin, v);
    renderList(); renderEditor();
  };
  paintNames();
  line.appendChild(num);
  line.appendChild(names);
  card.appendChild(line);
  card.appendChild(el('div', 'hint',
    '位值 = 2 的「状态编号」次方：中毒=2、定身=256、无敌=2097152、免疫嘲讽=4294967296。\n' +
    '勾选会自动把数字累加；原版值 = ' + origVal + '。要填别的位也可以直接改「数值」。'));
  pane.appendChild(card);
}

/* ── 技能 / AI ─────────────────────────────────────────── */
function cloneRounds(list) {
  return (list || []).map(r => ({
    conType: r.conType, conValue: r.conValue, msg: r.msg,
    skill1: {id: r.skill1.id, level: r.skill1.level},
    skill2: {id: r.skill2.id, level: r.skill2.level},
    targetType: r.targetType
  }));
}
function aiCurrent(id) {
  const edited = state.aiEdits[id];
  if (edited) return cloneRounds(edited);
  return cloneRounds(AI_ORIGINAL.get(id) || []);
}
function aiDirty(id) {
  const cur = state.aiEdits[id];
  if (!cur) return false;
  const orig = AI_ORIGINAL.get(id) || [];
  if (cur.length !== orig.length) return true;
  for (let i = 0; i < cur.length; i++) {
    const a = cur[i], b = orig[i];
    if (a.skill1.id !== b.skill1.id || a.skill1.level !== b.skill1.level) return true;
    if (a.skill2.id !== b.skill2.id || a.skill2.level !== b.skill2.level) return true;
    if (a.targetType !== b.targetType) return true;
  }
  return false;
}
function setAi(id, list) {
  state.aiEdits[id] = cloneRounds(list);
  if (!aiDirty(id)) delete state.aiEdits[id];
  renderList(); renderEditor();
}
function skillHint(sid, level) {
  if (!(sid > 0)) return {text: '（没配技能）', ok: true};
  const hit = SKILL_NAME.get(sid + ':' + level);
  if (hit) return {text: hit.name + (hit.type === 1 ? '（被动·不能主动放）' : ''), ok: hit.type !== 1};
  const info = SKILL_LEVELS.get(sid);
  if (!info) return {text: '没有这个技能', ok: false};
  return {text: '等级不对，可选 ' + info.levels.join('/'), ok: false};
}
function renderAiCard(pane, id) {
  const card = el('div', 'card');
  const bar = el('div', 'bar');
  bar.appendChild(el('h2', null, '技能 / AI（这只怪战斗里放什么）'));
  const rounds = aiCurrent(id);
  if (aiDirty(id)) bar.appendChild(el('span', 'tag', '已改 AI'));
  const addBtn = el('button', null, rounds.length ? '加一轮' : '新增一轮');
  addBtn.onclick = () => {
    const last = rounds[rounds.length - 1];
    const next = aiCurrent(id);
    next.push({conType: last ? last.conType : 0, conValue: last ? last.conValue : 0, msg: '',
      skill1: {id: 0, level: 0}, skill2: {id: 0, level: 0}, targetType: last ? last.targetType : 0});
    setAi(id, next);
  };
  bar.appendChild(addBtn);
  if (state.aiEdits[id]) {
    const reset = el('button', null, '恢复原 AI');
    reset.onclick = () => { delete state.aiEdits[id]; renderList(); renderEditor(); toast('已恢复原版 AI'); };
    bar.appendChild(reset);
  }
  card.appendChild(bar);

  if (!rounds.length) {
    card.appendChild(el('div', 'hint', '这只怪原版没有 AI 记录（战斗中只会平砍）。点「新增一轮」给它配技能。'));
    pane.appendChild(card);
    return;
  }

  rounds.forEach((r, i) => {
    const row = el('div', 'airow');
    row.appendChild(el('span', 'tag', '第 ' + (i + 1) + ' 轮'));
    const mkSkill = (slotKey, label) => {
      row.appendChild(el('span', 'hint', label));
      const sid = document.createElement('input');
      sid.type = 'text'; sid.inputMode = 'numeric'; sid.setAttribute('list', 'skill-list');
      sid.value = String(r[slotKey].id || '');
      sid.title = '技能 id（输入后会显示技能名）';
      const slv = document.createElement('input');
      slv.type = 'number'; slv.min = '0'; slv.max = '255';
      slv.value = String(r[slotKey].level || '');
      slv.title = '技能等级';
      const hint = el('span', 'sn');
      const paint = () => {
        const h = skillHint(Number(sid.value) || 0, Number(slv.value) || 0);
        hint.textContent = h.text;
        hint.className = 'sn ' + (h.ok ? 'ok' : 'err');
      };
      paint();
      const commit = () => {
        const next = aiCurrent(id);
        next[i][slotKey] = {id: Math.max(0, Math.trunc(Number(sid.value) || 0)), level: Math.max(0, Math.trunc(Number(slv.value) || 0))};
        setAi(id, next);
      };
      sid.onchange = commit; slv.onchange = commit;
      row.appendChild(sid); row.appendChild(slv); row.appendChild(hint);
    };
    mkSkill('skill1', '技能1');
    mkSkill('skill2', '技能2');
    row.appendChild(el('span', 'hint', '目标'));
    const tt = document.createElement('input');
    tt.type = 'number'; tt.min = '0'; tt.max = '255';
    tt.value = String(r.targetType || 0);
    tt.title = '目标类型（原版常见 0/2/4/11，含义随版本；不改就沿用原值）';
    tt.onchange = () => {
      const next = aiCurrent(id);
      next[i].targetType = Math.max(0, Math.min(255, Math.trunc(Number(tt.value) || 0)));
      setAi(id, next);
    };
    row.appendChild(tt);
    if (rounds.length > 1) {
      const del = el('button', null, '删这轮');
      del.onclick = () => { const next = aiCurrent(id); next.splice(i, 1); setAi(id, next); };
      row.appendChild(del);
    }
    card.appendChild(row);
  });
  card.appendChild(el('div', 'hint',
    '技能 id 可以直接输（右边会显示名字，等级不对会提示可选等级）；「被动」技能怪物不会主动放。\n' +
    '目标类型只在配了新技能时才有意义，默认沿用原值。没配的轮次会按序号保留原台词。'));
  pane.appendChild(card);
}

/* ── 事件与初始化 ─────────────────────────────────────── */
$('#btn-load') && ($('#btn-load').onclick = loadFromDir);
$('#btn-save').onclick = save;
$('#btn-download').onclick = () => { download('local-monster-overrides.json', buildConfigText()); toast('已下载，请放进 data/ 目录'); };
$('#q').oninput = () => { state.page = 1; state.resetScroll = true; renderList(); };
/* 保存/下载按钮在载入目录前置灰；但「下载配置」在没有目录时也应可用 → 直接放开 */
$('#btn-save').disabled = false;
$('#btn-download').disabled = false;
/* 技能候选列表（输入框里可直接搜 id / 名字） */
(function buildSkillList() {
  const dl = document.createElement('datalist');
  dl.id = 'skill-list';
  for (const [sid, info] of SKILL_LEVELS) {
    const o = document.createElement('option');
    o.value = String(sid);
    o.label = info.name;
    dl.appendChild(o);
  }
  document.body.appendChild(dl);
})();
state.selected = MONSTERS[0] && MONSTERS[0].id;
renderList();
renderEditor();
status("左边选怪 → 右边改属性 → 点「保存到 data/」选游戏的 <code>data</code> 文件夹（或直接下载放进 data/）。", "");
</script>
