<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>怪物编辑器 · 世界OL 单机版</title>
<style>
  :root{--bg:#10162a;--panel:#1b2340;--panel2:#151c33;--line:#36477a;--line2:#4a6db8;
    --text:#dfe7f7;--dim:#8fa3c8;--gold:#ffe9a8;--gold2:#c8a34d;--ok:#7fd18a;--err:#ff8f8f;
    --btn:#2e4270;--btn2:#3b5aa6;--chg:#ffd76e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 "Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;
    background:linear-gradient(#1d2748,#161e36);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:17px;color:var(--gold)}
  header .ver{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
  header .grow{flex:1}
  button{background:var(--btn);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px}
  button:hover{background:var(--btn2)}
  button.primary{background:#2f5ea8;border-color:#6f9fe8}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{display:grid;grid-template-columns:236px 1fr;height:calc(100vh - 52px)}
  aside{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column}
  aside .search{padding:7px;border-bottom:1px solid var(--line)}
  aside input{width:100%;background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:12px}
  aside .list{overflow:auto;flex:1;padding:5px}
  aside .item{display:flex;gap:6px;align-items:center;padding:5px 7px;border:1px solid transparent;border-radius:5px;cursor:pointer;font-size:12px}
  aside .item:hover{background:#222c4d}
  aside .item.active{background:#35467a;border-color:var(--gold2)}
  aside .item .id{color:var(--dim);min-width:38px}
  aside .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .item.changed .nm{color:var(--chg)}
  section{padding:12px 16px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:11px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px 12px}
  .f{display:flex;align-items:center;gap:6px}
  .f label{flex:1;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .f input{width:104px;background:#0e1526;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;text-align:right}
  .f input.dirty{border-color:var(--gold);color:var(--chg);background:#221d12}
  .f .revert{font-size:11px;color:var(--dim);cursor:pointer;padding:0 3px}
  .f .revert:hover{color:var(--gold)}
  .empty{color:var(--dim);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:9px}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .bar .tag{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;color:var(--dim)}
  #status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:80vw;padding:7px 13px;border-radius:7px;
    font-size:12px;display:none;z-index:20;background:#222c4d;border:1px solid var(--line2)}
  #status.ok{border-color:#3f7d4d;background:#1b3326;color:var(--ok)}
  #status.err{border-color:#7d3f3f;background:#331b1b;color:var(--err)}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2f5ea8;color:#fff;padding:7px 15px;
    border-radius:7px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  #toast.show{opacity:1}
</style>
</head>

<header>
  <h1>怪物编辑器</h1><span class="ver">第 94 版 · 属性 / 天生状态</span>

</header>
<main>

    <div class="list" id="list"></div>
  </aside>
  <section id="editor"><div class="empty">左边选一只怪开始编辑</div></section>
</main>

e":4,"icon1":"20702","hpMax":10000000,"mpMax":1000000,"speed":65535,"atkType":4,"atkMin":50000,"atkMax":65535,"atk_time":5,"dodge":30000,"atk_str":65535,"atk_str_nearby":0,"atk_str_range":0,"atk_agi":65535,"atk_agi_nearby":0,"atk_agi_range":0,"atk_magic":65535,"def_str":65535,"def_str_nearby":0,"def_str_range":0,"def_agi":65535,"def_agi_nearby":0,"def_agi_range":0,"def_magic":65535,"hitrate":8000,"hitMagic":8000,"critical":2000,"ignoreCritical":0,"criticalDmg":0,"ignore_back":0,"ignore_magic_back":0,"ignore_block":0,"ignore_insight":0,"ignore_touch":0,"ignore_wil":0,"wil":50000,"tough":50000,"block":5000,"brkArmor":30000,"insight":30000,"def_field":60000,"back":10000,"magic_back":10000,"life_absorption":3000,"mana_absorption":3000,"magic_penetration":30000,"bornStatus":"269383680","newReflection":0},{"id":4071,"name":"怨气恶魔","level":100,"monstertype":3,"icon1":"15600","hpMax":6500000,"mpMax":650000,"speed":40000,"atkType":3,"atkMin":30000,"atkMax":50000,"atk_time":3,"dodge":10000,"atk_str":65535,"atk_str_nearby":0,"atk_str_range":0,"atk_agi":65535,"atk_agi_nearby":0,"atk_agi_range":0,"atk_magic":65535,"def_str":65535,"def_str_nearby":0,"def_str_range":0,"def_agi":65535,"def_agi_nearby":0,"def_agi_range":0,"def_magic":65535,"hitrate":5000,"hitMagic":5000,"critical":1000,"ignoreCritical":0,"criticalDmg":0,"ignore_back":0,"ignore_magic_back":0,"ignore_block":0,"ignore_insight":0,"ignore_touch":0,"ignore_wil":0,"wil":20000,"tough":30000,"block":5000,"brkArmor":30000,"insight":20000,"def_field":30000,"back":5000,"magic_back":5000,"life_absorption":1000,"mana_absorption":1000,"magic_penetration":10000,"bornStatus":"931840","newReflection":0}]</script>
<script>
"use strict";
/* ============================================================
 * 怪物编辑器（第 94 版）
 *
 * 数据流：data/local-monster-overrides.json ⇄ 本编辑器
 * 生效链：lib/local-monster-overrides.mjs → official-data.ensure() 套用到
 *         officialMonsters（字段合并 + monsterWireBytes 重编码 wireBase64）
 *         → 战斗包 officialMonsterModels 发出新数据
 *
 * 只显示「改过的字段」到配置文件里；没改的字段不落盘（保持原版）。
 * ============================================================ */
const MONSTERS = JSON.parse(document.getElementById('monster-data').textContent);
const REVISION = 'monster-overrides-20261025-v1';

/* 字段分组：[key, 中文名, 类型提示] —— 与 lib/monster-balance.mjs 的 fields 一一对应 */
const GROUPS = [
  ['基础', [
    ['name', '名称'], ['level', '等级'], ['monstertype', '怪物类型'], ['icon1', '外观图标号']
  ]],
  ['生存', [
    ['hpMax', '生命上限'], ['mpMax', '法力上限'], ['speed', '出手速度']
  ]],
  ['攻击', [
    ['atkType', '攻击方式'], ['atkMin', '最小攻击'], ['atkMax', '最大攻击'], ['atk_time', '攻击次数-1']
  ]],
  ['命中 / 闪避 / 暴击', [
    ['hitrate', '命中值'], ['hitMagic', '魔法命中'], ['dodge', '躲闪'],
    ['critical', '致命值'], ['criticalDmg', '致命伤害'], ['ignoreCritical', '抗致命']
  ]],
  ['六维攻击', [
    ['atk_str', '劈砍攻击'], ['atk_str_nearby', '劈砍攻击(近身)'], ['atk_str_range', '劈砍攻击(远程)'],
    ['atk_agi', '穿刺攻击'], ['atk_agi_nearby', '穿刺攻击(近身)'], ['atk_agi_range', '穿刺攻击(远程)'],
    ['atk_magic', '魔法攻击']
  ]],
  ['六维防御', [
    ['def_str', '劈砍防御'], ['def_str_nearby', '劈砍防御(近身)'], ['def_str_range', '劈砍防御(远程)'],
    ['def_agi', '穿刺防御'], ['def_agi_nearby', '穿刺防御(近身)'], ['def_agi_range', '穿刺防御(远程)'],
    ['def_magic', '魔法防御']
  ]],
  ['抗性 / 减免', [
    ['ignore_back', '抗反击'], ['ignore_magic_back', '抗魔法反击'], ['ignore_block', '抗格挡'],
    ['ignore_insight', '抗洞察'], ['ignore_touch', '抗碰触'], ['ignore_wil', '抗意志'],
    ['back', '反击'], ['magic_back', '魔法反击'], ['block', '格挡'],
    ['brkArmor', '破甲'], ['insight', '洞察'], ['def_field', '护盾防御'],
    ['wil', '意志'], ['tough', '坚韧']
  ]],
  ['特殊', [
    ['life_absorption', '吸血'], ['mana_absorption', '吸蓝'], ['magic_penetration', '魔法穿透'],
    ['newReflection', '反弹'], ['bornStatus', '天生状态(位图)']
  ]]
];
const LIMITS = { level: 127, monstertype: 127, atkType: 127, atk_time: 127, critical: 32767 };
const ORIGINAL = new Map(MONSTERS.map(m => [m.id, m]));

const state = { selected: null, edits: {}, dirHandle: null, dirty: {} };  // edits: {id:{字段:值}}

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
let toastTimer = null;
function toast(m, ms = 2000) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function status(m, k = '') { const s = $('#status'); if (!m) { s.style.display = 'none'; return; } s.className = k; s.innerHTML = m; s.style.display = 'block'; }

/* ── 配置读写 ─────────────────────────────────────────── */
function normalizeIncoming(raw) {
  const out = {};
  const src = raw && raw.monsters && typeof raw.monsters === 'object' ? raw.monsters : {};
  const valid = new Set(GROUPS.flatMap(([, fs]) => fs.map(([k]) => k)));
  for (const [key, patch] of Object.entries(src)) {
    const id = Number(key);
    if (!Number.isInteger(id) || id <= 0 || !patch || typeof patch !== 'object') continue;
    const fields = {};
    for (const [f, v] of Object.entries(patch)) if (valid.has(f)) fields[f] = v;
    if (Object.keys(fields).length) out[id] = fields;
  }
  return out;
}
function buildConfigText() {
  const monsters = {};
  for (const [id, fields] of Object.entries(state.edits)) {
    if (!fields || !Object.keys(fields).length) continue;
    monsters[String(id)] = fields;
  }
  return JSON.stringify({
    _readme: [
      "怪物属性覆盖（第 94 版）。改运行时怪物表，不动 data/official-v305.json 原始抓包。",
      "monsters[怪物id] = { 字段:值 }；只写改过的字段，没写的就是原版值。",
      "可改字段见 lib/local-monster-overrides.mjs 的 MONSTER_FIELD_TYPES；",
      "套用时会给该怪用 monsterWireBytes 重编码 wireBase64，战斗包直接发新数据。",
      "天生状态 bornStatus 是位图数字（0=无），含义随版本不同，按原始值编辑。",
      "由 怪物编辑器.html 生成。"
    ],
    revision: REVISION,
    monsters
  }, null, 1) + "\n";
}
async function loadFromDir() {
  if (typeof window.showDirectoryPicker !== 'function') {
    status("这个浏览器不支持直接读目录（需要 Chrome/Edge）。可改用「下载配置」再放进 data/。", "err");
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'worldol-data' });
    state.dirHandle = dir;
    let raw = null;
    try {
      const fh = await dir.getFileHandle('local-monster-overrides.json');
      raw = JSON.parse(await (await fh.getFile()).text());
    } catch (err) {
      if (err && err.name !== 'NotFoundError' && err.name !== 'TypeError') throw err;
    }
    state.edits = normalizeIncoming(raw);
    $("#btn-save").disabled = false;
    $("#btn-download").disabled = false;
    renderList(); renderEditor();
    const n = Object.keys(state.edits).length;
    status(raw ? ("已载入配置（" + n + " 只怪被改过）。改完点<b>保存到 data/</b>，重启游戏生效。") : "目录里还没有配置文件，已从空白开始。", "ok");
  } catch (err) {
    if (err && err.name === 'AbortError') { state.dirHandle = null; return; }
    status("读取失败：" + (err && err.message || err), "err");
  }
}
async function save() {
  const text = buildConfigText();
  if (state.dirHandle) {
    try {
      const fh = await state.dirHandle.getFileHandle('local-monster-overrides.json', { create: true });
      const w = await fh.createWritable();
      await w.write(text); await w.close();
      const n = Object.keys(JSON.parse(text).monsters).length;
      status("已写入 <b>local-monster-overrides.json</b>（" + n + " 只怪）。重启游戏（电脑版）或重新打包（APK）生效。", "ok");
      toast("写入成功");
      return;
    } catch (err) {
      status("直接写入失败（" + (err && err.message || err) + "），已改为下载文件。", "err");
    }
  }
  download('local-monster-overrides.json', text);
  toast("已下载，请放进 data/ 目录");
}
function download(name, text) {
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 列表 ─────────────────────────────────────────────── */
function filtered() {
  const q = ($('#q').value || '').trim().toLowerCase();
  if (!q) return MONSTERS;
  return MONSTERS.filter(m => String(m.id).includes(q) || String(m.name || '').toLowerCase().includes(q));
}
function renderList() {
  const list = $('#list');
  list.innerHTML = '';
  const rows = filtered().slice(0, 500);
  if (!rows.length) { list.appendChild(el('div', 'hint', '没有匹配的怪物')); return; }
  for (const m of rows) {
    const changed = state.edits[m.id] && Object.keys(state.edits[m.id]).length;
    const item = el('div', 'item' + (state.selected === m.id ? ' active' : '') + (changed ? ' changed' : ''));
    item.appendChild(el('span', 'id', String(m.id)));
    item.appendChild(el('span', 'nm', m.name || '(无名)'));
    const lv = el('span', 'id', 'Lv' + (state.edits[m.id] && state.edits[m.id].level != null ? state.edits[m.id].level : m.level));
    item.appendChild(lv);
    item.onclick = () => { state.selected = m.id; renderList(); renderEditor(); };
    list.appendChild(item);
  }
}

/* ── 编辑区 ───────────────────────────────────────────── */
function currentValue(id, field) {
  const e = state.edits[id];
  if (e && Object.prototype.hasOwnProperty.call(e, field)) return e[field];
  const o = ORIGINAL.get(id);
  return o ? o[field] : '';
}
function renderEditor() {
  const pane = $('#editor');
  pane.innerHTML = '';
  if (!state.selected) { pane.appendChild(el('div', 'empty', '左边选一只怪开始编辑')); return; }
  const id = state.selected;
  const origin = ORIGINAL.get(id);
  if (!origin) { pane.appendChild(el('div', 'empty', '未知怪物')); return; }

  const bar = el('div', 'bar');
  const t = el('h2', null, (currentValue(id, 'name') || origin.name));
  bar.appendChild(t);
  bar.appendChild(el('span', 'tag', 'id ' + id));
  bar.appendChild(el('span', 'tag', '原版 Lv' + origin.level + ' · HP ' + origin.hpMax));
  const changedCount = state.edits[id] ? Object.keys(state.edits[id]).length : 0;
  if (changedCount) bar.appendChild(el('span', 'tag', '已改 ' + changedCount + ' 项'));
  const resetAll = el('button', null, '恢复整只怪');
  resetAll.onclick = () => { delete state.edits[id]; renderList(); renderEditor(); toast('已恢复为原版数值'); };
  bar.appendChild(resetAll);
  pane.appendChild(bar);
  pane.appendChild(el('div', 'hint', '输入框右边灰色小字是原版值；改过的字段会变金色。只保存改过的字段。'));

  for (const [gname, fields] of GROUPS) {
    const card = el('div', 'card');
    card.appendChild(el('h2', null, gname));
    const grid = el('div', 'grid');
    for (const [field, label] of fields) {
      const wrap = el('div', 'f');
      const lab = el('label', null, label);
      lab.title = field;
      wrap.appendChild(lab);
      const inp = document.createElement('input');
      inp.type = (field === 'name') ? 'text' : 'number';
      const cur = currentValue(id, field);
      inp.value = cur == null ? '' : cur;
      inp.placeholder = String(origin[field] == null ? '' : origin[field]);
      const dirty = state.edits[id] && Object.prototype.hasOwnProperty.call(state.edits[id], field);
      if (dirty) inp.classList.add('dirty');
      inp.onchange = () => {
        const lim = LIMITS[field];
        let v = field === 'name' ? inp.value.trim() : Number(inp.value);
        if (field === 'name') { if (!v) { inp.value = origin.name; return; } }
        else {
          if (!Number.isFinite(v)) { inp.value = origin[field]; return; }
          v = Math.round(v);
          if (v < 0) v = 0;
          if (lim && v > lim) { v = lim; toast(label + ' 上限 ' + lim + '，已截断'); }
        }
        inp.value = v;
        state.edits[id] = state.edits[id] || {};
        const origVal = origin[field];
        if (String(v) === String(origVal)) delete state.edits[id][field];
        else state.edits[id][field] = v;
        if (!Object.keys(state.edits[id]).length) delete state.edits[id];
        renderList();
        renderEditor();
      };
      wrap.appendChild(inp);
      const rev = el('span', 'revert', '↺');
      rev.title = '恢复此字段';
      rev.onclick = () => {
        if (state.edits[id]) { delete state.edits[id][field]; if (!Object.keys(state.edits[id]).length) delete state.edits[id]; }
        renderList(); renderEditor();
      };
      wrap.appendChild(rev);
      grid.appendChild(wrap);
    }
    card.appendChild(grid);
    pane.appendChild(card);
  }
  const tip = el('div', 'card');
  tip.appendChild(el('h2', null, '说明'));
  tip.appendChild(el('div', 'hint',
    '· 只改「改过的字段」，没动过的字段不进配置文件（保持原版）。\n' +
    '· 攻击次数 atk_time 原版存的是「次数 - 1」（想打 3 次就填 2）。\n' +
    '· 天生状态 bornStatus 是位图数字：0 = 没有天生状态；不同位的含义随版本变化，改之前先备份。\n' +
    '· 保存后：电脑版重启服务端生效；APK 需要重新打包。战斗里第一次遇到这只怪就是新数值。'));
  pane.appendChild(tip);
}

/* ── 事件与初始化 ─────────────────────────────────────── */
$('#btn-load') && ($('#btn-load').onclick = loadFromDir);
$('#btn-save').onclick = save;
$('#btn-download').onclick = () => { download('local-monster-overrides.json', buildConfigText()); toast('已下载，请放进 data/ 目录'); };
$('#q').oninput = renderList;
/* 保存/下载按钮在载入目录前置灰；但「下载配置」在没有目录时也应可用 → 直接放开 */
$('#btn-save').disabled = false;
$('#btn-download').disabled = false;
state.selected = MONSTERS[0] && MONSTERS[0].id;
